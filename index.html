<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forever 27 | Scan Your Gift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --ink: #0d0d0d; --paper: #faf7f2; --gold: #c9933a; --gold-light: #e8b86d; --cream: #f0ead8; --muted: #7a7060; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 480px; width: 100%; text-align: center; padding: 40px 24px; background: rgba(250,247,242,0.85); border: 1px solid rgba(201,147,58,0.15); border-radius: 24px; }
    .logo-mark { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
    .logo-sub { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 40px; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-style: italic; margin-bottom: 12px; }
    .hero-desc { font-size: 0.92rem; color: var(--muted); line-height: 1.65; margin-bottom: 36px; }
    .cta-btn { width: 100%; padding: 16px 24px; background: var(--ink); color: #fff; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(13,13,13,0.65); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
    .modal-card { background: var(--paper); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 28px 24px 40px; }
    .manual-wrap { display: flex; gap: 8px; margin-top: 20px; }
    .manual-input { flex: 1; padding: 13px 16px; border: 1px solid var(--cream); border-radius: 10px; }
    .manual-btn { padding: 0 22px; background: var(--gold); color: #fff; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-mark">Forever 27</div>
    <div class="logo-sub">Physical to Digital</div>
    <h1 class="hero-title">Unwrap your memory</h1>
    <p class="hero-desc">Scan the QR code on your gift card to upload or watch your personalized video keepsake.</p>
    <button class="cta-btn" id="scan-btn" onclick="openModal()">✨ Scan QR Code</button>
  </div>

  <div class="modal-overlay" id="scan-modal">
    <div class="modal-card">
      <div id="qr-reader" style="width:100%"></div>
      <div class="manual-wrap">
        <input type="text" id="manual-code" class="manual-input" placeholder="e.g. GIFT-A1B2C3" />
        <button class="manual-btn" onclick="goWithCode()">Go</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://videogift-backend-3.onrender.com';
    let qrScanner = null;

    function openModal() {
      document.getElementById('scan-modal').style.display = 'flex';
      qrScanner = new Html5Qrcode("qr-reader");
      qrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
        closeModal();
        navigateToGift(decodedText);
      });
    }

    function closeModal() {
      if(qrScanner) qrScanner.stop().catch(()=>{});
      document.getElementById('scan-modal').style.display = 'none';
    }

    async function navigateToGift(rawText) {
      let giftId = rawText.trim();
      const btn = document.querySelector('.cta-btn');
      btn.innerText = "Checking code...";
      btn.disabled = true;

      try {
        const response = await fetch(`${BACKEND_URL}/api/validate?id=${encodeURIComponent(giftId)}`);
        const result = await response.json();
        if (result.isValid) {
          window.location.href = `upload.html?id=${encodeURIComponent(giftId)}`;
        } else {
          alert("This code does not exist.");
          btn.innerText = "✨ Scan QR Code";
          btn.disabled = false;
        }
      } catch (e) {
        alert("Connection error.");
        btn.innerText = "✨ Scan QR Code";
        btn.disabled = false;
      }
    }

    function goWithCode() {
      const code = document.getElementById('manual-code').value;
      if(code) navigateToGift(code);
    }
  </script>
</body>
</html>
