<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#241552; --bg2:#4a1d7a; --ink:#fff6e8; --a:#ff6fa5; --b:#ffd23f; --c:#4de1d2; --card:rgba(255,255,255,.1); --line:rgba(255,246,232,.35); --btnink:#241552; }
  body[data-theme=blue] { --bg:#07224d; --bg2:#0f4c9c; --a:#ff8a4c; --b:#ffd23f; --c:#6ee7ff; --btnink:#07224d; }
  body[data-theme=white] { --bg:#eef3ff; --bg2:#ffe9f6; --ink:#271a4a; --a:#e0457b; --b:#f2a900; --c:#1fa8a0; --card:#fff; --line:rgba(39,26,74,.3); --btnink:#fff; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { min-height:100svh; background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed; color:var(--ink); font-family:'Nunito','Noto Sans Ethiopic',system-ui,sans-serif; line-height:1.55; overflow-x:hidden; }
  body.am { font-family:'Noto Sans Ethiopic','Nunito',sans-serif; }
  .stars { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .stars circle { animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity:.2; } to { opacity:1; } }
  main { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:env(safe-area-inset-top,0px) 20px max(28px, env(safe-area-inset-bottom)); text-align:center; }
  .lang { display:flex; justify-content:flex-end; gap:6px; padding-top:8px; }
  .lang button { font:inherit; font-size:.85rem; border:2px solid var(--ink); background:transparent; color:var(--ink); border-radius:999px; padding:3px 12px; cursor:pointer; }
  .lang button[aria-pressed=true] { background:var(--ink); color:var(--bg); }
  .lang button:focus-visible, .btn:focus-visible { outline:3px solid var(--b); outline-offset:3px; }
  .hero { position:relative; height:190px; }
  .rocket { position:absolute; left:50%; top:6px; margin-left:-46px; animation:fly 3s ease-in-out infinite alternate; }
  @keyframes fly { from { transform:translateY(8px) rotate(-3deg); } to { transform:translateY(-6px) rotate(3deg); } }
  .flame { transform-box:fill-box; transform-origin:50% 0; animation:fl .25s ease-in-out infinite alternate; }
  @keyframes fl { from { transform:scaleY(.8); } to { transform:scaleY(1.2); } }
  .planet { position:absolute; animation:fly 5s ease-in-out infinite alternate; }
  .say { margin:0; font-size:1.05rem; }
  h1 { font-family:'Fredoka','Noto Sans Ethiopic',sans-serif; font-weight:700; font-size:clamp(2.3rem,10.5vw,3.8rem); line-height:1.08; margin:6px 0 8px; color:var(--b); text-wrap:balance; }
  body.am h1 { font-family:'Noto Sans Ethiopic',sans-serif; line-height:1.25; }
  body[data-theme=white] h1 { color:var(--a); }
  .host { margin:0 0 24px; opacity:.9; }
  .porthole { width:min(250px,68vw); aspect-ratio:1; margin:0 auto 28px; border-radius:50%; background:#c9cfe4 conic-gradient(from 0deg,#e8ecf8,#9aa3c4,#e8ecf8,#9aa3c4,#e8ecf8); padding:12px; box-shadow:0 10px 26px rgba(0,0,0,.35); position:relative; }
  .porthole .pic { width:100%; height:100%; border-radius:50%; background:#1b1440 center/cover no-repeat; box-shadow:inset 0 0 0 4px #6b7394, inset 0 6px 14px rgba(0,0,0,.5); }
  .porthole i { position:absolute; width:11px; height:11px; border-radius:50%; background:#6b7394; box-shadow:inset 0 -2px 0 rgba(0,0,0,.3); }
  .when, .where { background:var(--card); border:2px dashed var(--line); border-radius:24px; padding:20px 18px; margin:0 0 16px; backdrop-filter:blur(4px); }
  .when .big { font-family:'Fredoka','Noto Sans Ethiopic',sans-serif; font-weight:700; font-size:1.5rem; line-height:1.25; margin:0; }
  .when .sm { margin:2px 0 0; font-size:1.1rem; color:var(--c); font-weight:700; }
  body[data-theme=white] .when .sm { color:var(--c); }
  .where p { margin:0 0 12px; font-weight:700; }
  .btn { display:inline-block; font:inherit; font-weight:700; text-decoration:none; background:var(--b); color:var(--btnink); border-radius:999px; padding:10px 22px; }
  body[data-theme=white] .btn { background:var(--a); }
  .prog { list-style:none; margin:0 0 16px; padding:0 0 0 6px; text-align:left; position:relative; }
  .prog::before { content:""; position:absolute; left:17px; top:14px; bottom:14px; border-left:2px dashed var(--line); }
  .prog li { position:relative; display:flex; gap:14px; align-items:center; padding:8px 0; }
  .prog li::before { content:""; flex:0 0 24px; height:24px; border-radius:50%; background:var(--b); box-shadow:inset -5px -4px 0 rgba(0,0,0,.18); z-index:1; }
  .prog li:nth-child(3n+2)::before { background:var(--a); } .prog li:nth-child(3n)::before { background:var(--c); }
  .prog b { margin-right:auto; } .prog span { opacity:.85; }
  .msg { font-size:1.1rem; margin:22px 4px; white-space:pre-line; text-wrap:pretty; }
  .gal { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:14px 20px 26px; margin:0 -20px; }
  .gal img { flex:0 0 auto; width:min(210px,62vw); aspect-ratio:3/4; object-fit:cover; scroll-snap-align:center; border-radius:22px; border:4px solid var(--ink); box-shadow:0 8px 18px rgba(0,0,0,.3); }
  .foot { display:flex; justify-content:center; align-items:flex-end; gap:18px; margin-top:28px; }
  .foot .astro { animation:fly 4s ease-in-out infinite alternate; }
  .err { padding:40px 0; font-weight:700; }
  @media (prefers-reduced-motion:reduce) { .stars circle, .rocket, .flame, .planet, .foot .astro { animation:none; } }
</style>
</head>
<body data-theme="pink">
<svg class="stars" id="stars" aria-hidden="true"></svg>
<main>
  <div class="lang"><button id="bEn" type="button">English</button><button id="bAm" type="button" lang="am">አማርኛ</button></div>
  <div id="content"></div>
</main>
<script>
const API = 'https://videogift-backend-3.onrender.com';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);

/* Ethiopian calendar */
const EM = ['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜን'];
const g2j = (y, m, d) => { const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3; return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045; };
const j2e = j => { const k = j - 1723856, r = ((k % 1461) + 1461) % 1461, n = (r % 365) + 365 * Math.floor(r / 1460); return { y:4 * Math.floor(k / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), m:Math.floor(n / 30) + 1, d:(n % 30) + 1 }; };

const T = {
  en: { say:'Join our birthday adventure!', host:'Hosted by', map:'Open map', prog:'Mission plan', err:'We could not load this invitation.' },
  am: { say:'ወደ ልደት ጀብዳችን ኑ!', host:'ጋባዦች', map:'ካርታ ክፈት', prog:'የበዓሉ ፕሮግራም', err:'ይህን ግብዣ መጫን አልተቻለም።' }
};
const WD_AM = ['እሑድ','ሰኞ','ማክሰኞ','ረቡዕ','ሐሙስ','ዓርብ','ቅዳሜ'];
const WD_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let lang = qs.get('lang') || localStorage.getItem('f27_lang') || 'en'; if (lang !== 'am') lang = 'en';
let ev = null;

const DEMO = {
  title:'Liya turns 7!', title_am:'ሊያ 7 ዓመት ሞላት!', host_names:'Mum, Dad & Nahom', host_names_am:'እማማ፣ አባባ እና ናሆም',
  event_date:'2026-12-12T15:00', venue:'Our home, Bole, Addis Ababa', venue_am:'ቤታችን፣ ቦሌ፣ አዲስ አበባ', map_url:'https://maps.google.com/?q=Bole+Addis+Ababa',
  message:'Cake, games and a piñata! Bring your biggest smile.', message_am:'ኬክ፣ ጨዋታ እና ብዙ ደስታ! ፈገግታችሁን ይዛችሁ ኑ።',
  days:[{ title:'Games', title_am:'ጨዋታ', date:'2026-12-12', start:'15:00' }, { title:'Cake time', title_am:'የኬክ ሰዓት', date:'2026-12-12', start:'17:00' }]
};
const pick = (o, k) => (lang === 'am' && o[k + '_am']) ? o[k + '_am'] : (o[k] || '');
const pad = n => String(n).padStart(2, '0');
function parseDate(s) { const m = /^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d))?/.exec(s || ''); return m ? { y:+m[1], m:+m[2], d:+m[3], hh:m[4] != null ? +m[4] : null, mm:m[5] != null ? +m[5] : null } : null; }
function dateText(p) {
  const wd = new Date(p.y, p.m - 1, p.d).getDay();
  if (lang === 'am') { const e = j2e(g2j(p.y, p.m, p.d)); return WD_AM[wd] + '፣ ' + EM[e.m - 1] + ' ' + e.d + ' ቀን ' + e.y + ' ዓ.ም'; }
  return WD_EN[wd] + ', ' + p.d + ' ' + MO_EN[p.m - 1] + ' ' + p.y;
}
function timeText(p) {
  if (p.hh == null) return '';
  const h12 = p.hh % 12 || 12;
  return lang === 'am' ? h12 + ':' + pad(p.mm) + (p.hh < 12 ? ' ጠዋት' : ' ከሰዓት') : h12 + ':' + pad(p.mm) + (p.hh < 12 ? ' AM' : ' PM');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const src = u => /^(https?:|data:|blob:)/i.test(u) ? u : API + (u.startsWith('/') ? '' : '/') + u;
const cols = () => { const cs = getComputedStyle(document.body); return ['--a', '--b', '--c', '--ink'].map(v => cs.getPropertyValue(v).trim()); };

function stars() {
  const C = cols(); let s = '';
  for (let i = 0; i < 70; i++) { const x = (i * 37.7) % 100, y = (i * 61.3) % 100, r = .8 + (i % 4) * .5;
    s += '<circle cx="' + x + '%" cy="' + y + '%" r="' + r + '" fill="' + (i % 5 ? C[3] : C[1]) + '" style="animation-delay:-' + (i % 7) * .5 + 's;animation-duration:' + (2 + i % 4) + 's"/>'; }
  $('stars').innerHTML = s;
}
function rocket(C) {
  return '<svg class="rocket" viewBox="0 0 92 170" width="92" height="170" aria-hidden="true"><g class="flame"><path d="M32 112q14 56 28 0z" fill="' + C[1] + '"/><path d="M39 112q7 30 14 0z" fill="#fff" opacity=".85"/></g><path d="M20 92L2 118v-22l14-26zM72 92l18 26v-22L76 70z" fill="' + C[0] + '"/><path d="M46 2C22 24 22 62 28 112h36c6-50 6-88-18-110z" fill="#f4f6ff"/><path d="M46 2C30 18 26 38 26 58h40C66 38 62 18 46 2z" fill="' + C[0] + '"/><circle cx="46" cy="70" r="13" fill="#2b2a66"/><circle cx="46" cy="70" r="9" fill="' + C[2] + '"/><ellipse cx="42" cy="66" rx="3" ry="4" fill="#fff" opacity=".7"/><rect x="28" y="100" width="36" height="8" fill="' + C[1] + '"/></svg>';
}
function planet(C, c, size, style) {
  return '<svg class="planet" viewBox="0 0 80 80" width="' + size + '" height="' + size + '" style="' + style + '" aria-hidden="true"><circle cx="40" cy="40" r="22" fill="' + c + '"/><path d="M26 30q14-8 28 0M24 44q16 8 32 0" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none"/><ellipse cx="40" cy="42" rx="38" ry="10" fill="none" stroke="' + C[1] + '" stroke-width="4" transform="rotate(-18 40 42)" stroke-dasharray="70 100" stroke-dashoffset="-34"/></svg>';
}
function astro(C) {
  return '<svg class="astro" viewBox="0 0 80 100" width="76" height="95" aria-hidden="true"><rect x="10" y="44" width="14" height="30" rx="6" fill="#c9cfe4"/><rect x="22" y="40" width="38" height="38" rx="14" fill="#f4f6ff"/><rect x="30" y="52" width="22" height="10" rx="3" fill="' + C[0] + '"/><rect x="26" y="76" width="11" height="18" rx="5" fill="#f4f6ff"/><rect x="45" y="76" width="11" height="18" rx="5" fill="#f4f6ff"/><circle cx="41" cy="26" r="21" fill="#f4f6ff"/><ellipse cx="41" cy="27" rx="15" ry="12" fill="#2b2a66"/><ellipse cx="36" cy="23" rx="4" ry="3" fill="#fff" opacity=".6"/><path d="M58 52l14-14" stroke="#f4f6ff" stroke-width="9" stroke-linecap="round"/><path d="M33 33q8 5 16 0" stroke="' + C[2] + '" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
}
function alien(C) {
  return '<svg class="astro" viewBox="0 0 70 80" width="62" height="70" style="animation-delay:-2s" aria-hidden="true"><path d="M35 6l-4 12M25 8l-3 11" stroke="' + C[2] + '" stroke-width="2"/><circle cx="31" cy="5" r="3.5" fill="' + C[1] + '"/><circle cx="22" cy="7" r="3.5" fill="' + C[1] + '"/><path d="M35 14c-20 0-28 18-26 30 2 14 14 22 26 22s24-8 26-22c2-12-6-30-26-30z" fill="' + C[2] + '"/><ellipse cx="25" cy="38" rx="7" ry="9" fill="#241552"/><ellipse cx="45" cy="38" rx="7" ry="9" fill="#241552"/><circle cx="27" cy="35" r="2.5" fill="#fff"/><circle cx="47" cy="35" r="2.5" fill="#fff"/><path d="M28 54q7 6 14 0" stroke="#241552" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
}
function render() {
  const t = T[lang], c = $('content'); document.body.classList.toggle('am', lang === 'am'); document.documentElement.lang = lang;
  $('bEn').setAttribute('aria-pressed', lang === 'en'); $('bAm').setAttribute('aria-pressed', lang === 'am');
  if (!ev) { c.innerHTML = '<div class="err">' + esc(t.err) + '</div>'; return; }
  const th = qs.get('theme') || ev.theme; document.body.dataset.theme = ['pink', 'blue', 'white'].includes(th) ? th : 'pink'; stars();
  const C = cols(), p = [], photos = (ev.photo_urls && ev.photo_urls.length) ? ev.photo_urls : (ev.photo_url ? [ev.photo_url] : []);
  p.push('<div class="hero">' + planet(C, C[2], 64, 'left:2%;top:30px') + rocket(C) + planet(C, C[0], 52, 'right:4%;top:90px;animation-delay:-2s') + '</div>');
  p.push('<p class="say">' + esc(t.say) + '</p><h1>' + esc(pick(ev, 'title')) + '</h1>');
  const host = pick(ev, 'host_names'); if (host) p.push('<p class="host">' + esc(t.host) + ' ' + esc(host) + '</p>');
  if (photos[0]) p.push('<div class="porthole"><div class="pic" role="img" aria-label="" style="background-image:url(\'' + esc(src(photos[0])).replace(/'/g, '%27') + '\')"></div><i style="left:50%;top:2px;margin-left:-5px"></i><i style="left:50%;bottom:2px;margin-left:-5px"></i><i style="top:50%;left:2px;margin-top:-5px"></i><i style="top:50%;right:2px;margin-top:-5px"></i></div>');
  const d = parseDate(ev.event_date);
  if (d) p.push('<div class="when"><p class="big">' + esc(dateText(d)) + '</p>' + (timeText(d) ? '<p class="sm">' + esc(timeText(d)) + '</p>' : '') + '</div>');
  const venue = pick(ev, 'venue');
  if (venue) p.push('<div class="where"><p>' + esc(venue) + '</p>' + (/^https?:\/\//i.test(ev.map_url || '') ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(ev.map_url) + '">' + esc(t.map) + '</a>' : '') + '</div>');
  const days = Array.isArray(ev.days) ? ev.days : [];
  if (days.length > 1 || (days.length === 1 && days[0].title)) p.push('<ul class="prog" aria-label="' + esc(t.prog) + '">' + days.map(x => {
    const tm = x.start ? timeText(parseDate('2000-01-01T' + x.start)) : ''; return '<li><b>' + esc(pick(x, 'title')) + '</b>' + (tm ? '<span>' + esc(tm) + '</span>' : '') + '</li>'; }).join('') + '</ul>');
  const msg = pick(ev, 'message') || pick(ev, 'about').replace(/\s*\[\[tpl:\w+\]\]\s*$/, ''); if (msg) p.push('<p class="msg">' + esc(msg) + '</p>');
  const gal = [...photos.slice(1), ...(Array.isArray(ev.gallery_urls) ? ev.gallery_urls : [])];
  if (gal.length) p.push('<div class="gal">' + gal.map(u => '<img alt="" loading="lazy" src="' + esc(src(u)) + '">').join('') + '</div>');
  p.push('<div class="foot">' + astro(C) + alien(C) + '</div>');
  c.innerHTML = p.join('');
}
$('bEn').onclick = () => { lang = 'en'; localStorage.setItem('f27_lang', lang); render(); };
$('bAm').onclick = () => { lang = 'am'; localStorage.setItem('f27_lang', lang); render(); };

(async function () {
  const slug = qs.get('e');
  if (!slug) { ev = Object.assign({}, DEMO); if (qs.get('title')) ev.title = qs.get('title'); }
  else { try { const r = await fetch(API + '/api/events/' + encodeURIComponent(slug)); if (!r.ok) throw new Error(r.status); ev = await r.json(); } catch (e) { ev = null; } }
  render();
})();
</script>
</body>
</html>
