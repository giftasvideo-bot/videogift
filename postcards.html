<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever 27 | Postcard Printing</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicons/favicon.ico">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <meta name="theme-color" content="#c9933a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --ink: #0d0d0d;
      --paper: #faf7f2;
      --gold: #c9933a;
      --gold-light: #e8b86d;
      --cream: #f0ead8;
      --muted: #7a7060;
      --success-bg: #e8f5e9;
      --success-text: #2e7d32;
      --pending-bg: #fff3e0;
      --pending-text: #ef6c00;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .dashboard { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 32px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 8px; }
    .logo span { color: var(--gold); font-style: italic; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 8px; }
    .header-links { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }

    .card-section {
      background: #ffffff; border: 1px solid var(--cream);
      border-radius: 12px; padding: 30px; margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.01);
    }
    h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    .btn {
      padding: 12px 24px; background: var(--gold); color: #ffffff;
      border: none; border-radius: 6px; font-weight: 500; cursor: pointer;
      transition: background 0.2s; font-family: 'DM Sans', sans-serif;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--cream); color: var(--ink); }
    .btn-secondary:hover { background: #e5dec9; }

    .notice-box {
      background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px;
      padding: 12px 16px; font-size: 0.85rem; color: #2e7d32; margin-bottom: 16px;
    }
    .notice-box.warn { background: #fff3e0; border-color: #ffcc80; color: #ef6c00; }

    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 6px 14px; border: 1px solid var(--cream); border-radius: 20px;
      background: #fff; color: var(--muted); font-size: 0.8rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s;
    }
    .filter-btn.active { background: var(--gold); color: #fff; border-color: var(--gold); }

    .type-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .type-bar .type-label { font-size: 0.8rem; color: var(--muted); margin-right: 2px; }
    .pc-preview { display: flex; gap: 14px; align-items: flex-start; margin: -4px 0 16px; padding: 12px; border: 1px solid var(--border, #e5ddd0); border-radius: 10px; background: var(--panel-bg, #faf6ee); }
    .pc-preview .pc-preview-shot { text-align: center; }
    .pc-preview .pc-preview-shot img { width: 120px; height: auto; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); background: #fff; display: block; }
    .pc-preview .pc-preview-shot span { display: block; margin-top: 4px; font-size: 0.72rem; color: var(--muted); }
    .pc-preview .pc-preview-label { font-size: 0.78rem; color: var(--muted); align-self: center; }
    .type-select {
      padding: 10px 16px; border: 1px solid var(--cream); border-radius: 8px;
      background: #fff; color: var(--ink); font-size: 0.9rem; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500;
      min-width: 200px;
    }
    .type-select:focus { outline: none; border-color: var(--gold); }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .toolbar .spacer { flex: 1; }
    .selected-count { font-size: 0.85rem; color: var(--muted); }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .pc-tile {
      border: 1px solid var(--cream); border-radius: 10px; padding: 14px;
      background: var(--paper); display: flex; flex-direction: column; gap: 8px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .pc-tile:hover { border-color: var(--gold-light); }
    .pc-tile.selected { border-color: var(--gold); background: #fff8ec; }
    .pc-tile-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pc-id { font-family: monospace; font-weight: 700; font-size: 0.92rem; }
    .pc-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .pc-badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pc-badge.sold { background: #fff8e1; color: #7a6020; }
    .pc-badge.unsold { background: #f5f5f5; color: #9e9e9e; }
    .pc-badge.printed { background: var(--success-bg); color: var(--success-text); }
    .pc-badge.not-printed { background: var(--pending-bg); color: var(--pending-text); }
    .pc-tile.locked { opacity: 0.65; cursor: not-allowed; }
    .pc-unlock-btn {
      margin-top: 8px; width: 100%; font-size: 0.72rem; padding: 5px 8px;
      border: 1px solid var(--border, #e0d8c8); border-radius: 6px; background: #fff;
      cursor: pointer; color: #7a5b20;
    }
    .pc-unlock-btn:hover { background: #fdf6e8; }

    /* === Printable postcard pages (built inside the popup window) === */
    .pc-print-page {
      width: 297mm; height: 210mm; position: relative; overflow: hidden;
      page-break-after: always;
    }
    .pc-print-page:last-child { page-break-after: auto; }
    .pc-print-page img.pc-bg {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .pc-qr-overlay {
      position: absolute;
      left: 61%; top: 56%;
      width: 15%;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .pc-qr-overlay img { width: 100%; height: auto; display: block; background: #fff; }
    .pc-qr-overlay .pc-caption {
      margin-top: 6px; font-family: 'DM Sans', sans-serif; font-weight: 600;
      font-size: 9px; line-height: 1.3; color: #333;
    }
    .pc-qr-overlay .pc-id-caption {
      margin-top: 2px; font-family: monospace; font-weight: 700; font-size: 8px; color: #555;
    }
  </style>
</head>
<body>

<script>
  // Auth guard — same login system as admin.html, but this page also
  // accepts the separate postcard-staff account. Full admins can still use
  // it too. currentRole is set once verify() resolves and gates the
  // admin-only unlock control further down.
  const SESSION_KEY = 'f27_admin_auth';
  let currentRole = null;
  function getSession() { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
  function getAuthToken() {
    const s = getSession();
    return (s && s.token && s.expires > Date.now()) ? s.token : null;
  }
  (async function authGuard() {
    const token = getAuthToken();
    if (!token) { window.location.replace('login-postcards.html'); return; }
    try {
      const BACKEND = localStorage.getItem('videogift_api_url') || 'https://videogift-backend-3.onrender.com';
      const res = await fetch(`${BACKEND}/api/admin/verify`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!res.ok) { sessionStorage.removeItem(SESSION_KEY); window.location.replace('login-postcards.html'); return; }
      const data = await res.json().catch(() => ({}));
      currentRole = data.role || null;
      if (currentRole !== 'admin') {
        const backLink = document.getElementById('back-to-dashboard-link');
        if (backLink) backLink.style.display = 'none';
      }
    } catch (err) {
      console.warn('Token verification skipped — backend unreachable.');
    }
  })();
</script>

<div class="dashboard">
  <div class="header">
    <div class="logo">Forever<span>27</span></div>
    <h1>💌 Postcard Print Layout</h1>
    <div class="header-links">
      <button class="btn btn-secondary" id="back-to-dashboard-link" style="font-size:0.8rem; padding:8px 18px;" onclick="window.location.href='admin.html'">← Back to Dashboard</button>
    </div>
  </div>

  <div class="card-section">
    
    <div class="notice-box warn" id="assets-warning" style="display:none;"></div>

    <div class="type-bar" id="type-bar">
      <span class="type-label">Postcard design:</span>
    </div>

    <div class="pc-preview" id="pc-preview" style="display:none;"></div>

    <div class="filter-bar">
      <button class="filter-btn active" id="filter-unsold" onclick="setFilter('unsold')">Unsold <span id="count-unsold"></span></button>
      <button class="filter-btn" id="filter-all" onclick="setFilter('all')">All <span id="count-all"></span></button>
      <button class="filter-btn" id="filter-sold" onclick="setFilter('sold')">Sold <span id="count-sold"></span></button>
      <button class="filter-btn" id="filter-pc-no" onclick="setFilter('pc-no')">🔴 Postcard not printed <span id="count-pc-no"></span></button>
      <button class="filter-btn" id="filter-pc-yes" onclick="setFilter('pc-yes')">✅ Postcard printed <span id="count-pc-yes"></span></button>
    </div>

    <div class="toolbar">
      <button class="btn btn-secondary" onclick="selectAllVisible()">☑️ Select all shown</button>
      <button class="btn btn-secondary" onclick="clearSelection()">Clear selection</button>
      <span style="font-size:0.8rem; color:var(--muted); margin-left:6px;">Page size:</span>
      <button class="filter-btn active" id="size-a4" onclick="setPageSize('a4')">A4</button>
      <button class="filter-btn" id="size-a5" onclick="setPageSize('a5')">A5</button>
      <div class="spacer"></div>
      <span class="selected-count" id="selected-count">0 selected</span>
      <button class="btn btn-secondary pdf-btn" id="pdf-selected-btn" onclick="downloadPostcardsPdf()">⬇️ Download Print PDF</button>
      
    </div>

    <div class="qr-grid" id="pc-grid-container"></div>
  </div>
</div>

<script>
  let BACKEND_API_BASE = localStorage.getItem('videogift_api_url') || 'https://videogift-backend-3.onrender.com';
  let localRegistry = [];
  let buyerMap = {};
  let currentFilter = 'unsold';
  let selectedIds = new Set();
  let pageSizeChoice = 'a4';
  const PAGE_DIMENSIONS = { a4: { w: 297, h: 210 }, a5: { w: 210, h: 148.5 } };
  function setPageSize(size) {
    pageSizeChoice = size;
    document.getElementById('size-a4').classList.toggle('active', size === 'a4');
    document.getElementById('size-a5').classList.toggle('active', size === 'a5');
  }

  // --- Postcard designs (front/inside artwork per category/variant) -------
  // Each category has one or more variants. File naming convention:
  // single-variant category → `<categoryKey>.png` / `<categoryKey>-inside.png`
  // multi-variant category  → `<categoryKey>-<variantKey>.png` / `<categoryKey>-<variantKey>-inside.png`
  // --- Postcard designs (front/inside artwork per category/variant) -------
  // Each category has one or more variants. File naming convention:
  // single-design category  → `<categoryKey>.png` / `<categoryKey>-inside.png`
  // multi-variant category  → `<categoryKey>-<variantKey>.png` / `<categoryKey>-<variantKey>-inside.png`
  // "3 generic designs" categories use `<prefix>-1.png` / `<prefix>-1-inside.png`
  // etc. — same convention as the gallery on index.html, so the same
  // uploaded art files work in both places.
  function threeVariants(prefix) {
    return [1, 2, 3].map(n => ({
      key: `design${n}`,
      label: `🎨 Design ${n}`,
      front: `${prefix}-${n}.png`,
      inside: `${prefix}-${n}-inside.png`,
    }));
  }

  const POSTCARD_TYPES = {
    love:       { label: '❤️ Love',        variants: threeVariants('love') },
    graduation: { label: '🎓 Graduation',  variants: threeVariants('graduation') },
    birthday:   { label: '🎂 Birthday', variants: [
      { key: 'boy',   label: '👦 Boy',   front: 'birthday-boy.png',   inside: 'birthday-boy-inside.png' },
      { key: 'girl',  label: '👧 Girl',  front: 'birthday-girl.png',  inside: 'birthday-girl-inside.png' },
      { key: 'woman', label: '👩 Woman', front: 'birthday-woman.png', inside: 'birthday-woman-inside.png' },
      { key: 'man',   label: '👨 Man',   front: 'birthday-man.png',   inside: 'birthday-man-inside.png' },
      { key: 'couple', label: '💑 Couple', front: 'birthday-couple.png', inside: 'birthday-couple-inside.png' },
    ]},
    holiday:    { label: '🎄 Holiday', variants: [
      { key: 'new_year', label: '🎉 New Year', front: 'holiday-new_year.png', inside: 'holiday-new_year-inside.png' },
      { key: 'meskel',   label: '☦️ Meskel',    front: 'holiday-meskel.png',   inside: 'holiday-meskel-inside.png' },
    ]},
    friendship: { label: '🤝 Friendship',  variants: threeVariants('friendship') },
    sorry:      { label: '🙏 I\'m Sorry',  variants: threeVariants('sorry') },
    mom_to_be:  { label: '🤰 Mom to Be',   variants: threeVariants('momtobe') },
    wedding:    { label: '💍 Wedding/Anniversary', variants: threeVariants('wedding') },
    bride_to_be: { label: '👰 Bride to Be', variants: [
      { key: 'default', label: '👰 Bride to Be', front: 'bride-to-be.png', inside: 'bride-to-be-inside.png' },
    ]},
    thankyou:   { label: '🙏 Thank You',   variants: threeVariants('thankyou') },
    family:     { label: '👨‍👩‍👧‍👦 Family', variants: threeVariants('family') },
  };
  let currentCategory = 'love';
  let currentVariant = 'design1';
  // 'postcard' = full front/inside artwork with QR overlay (current behavior).
  // 'qr_only'  = a plain sheet of QR-code labels, no postcard artwork at all —
  // for sales where only the QR code itself is sold, not a physical postcard.
  let printMode = 'postcard';

  // The design object ({label, front, inside}) currently in effect.
  function getCurrentDesign() {
    const cat = POSTCARD_TYPES[currentCategory];
    return cat.variants.find(v => v.key === currentVariant) || cat.variants[0];
  }
  // Unique cache/lookup key for the current selection.
  function currentDesignKey() {
    return `${currentCategory}:${currentVariant}`;
  }

  function setPrintMode(mode) {
    printMode = mode;
    renderTypeBar();
    checkAssets();
    renderPreview();
  }

  // Small live sample of the currently selected front/inside artwork, so you
  // can see what "Love — Design 1" (etc.) actually looks like before printing
  // a whole batch. Just thumbnails of the same files checkAssets() verifies.
  function renderPreview() {
    const box = document.getElementById('pc-preview');
    if (printMode !== 'postcard') { box.style.display = 'none'; return; }
    const design = getCurrentDesign();
    box.style.display = 'flex';
    box.innerHTML = `
      <span class="pc-preview-label">Sample —<br>${POSTCARD_TYPES[currentCategory].label}<br>${design.label}</span>
      <div class="pc-preview-shot"><img src="${design.front}" alt="Front sample"><span>Front</span></div>
      <div class="pc-preview-shot"><img src="${design.inside}" alt="Inside sample"><span>Inside</span></div>
    `;
  }

  function renderTypeBar() {
    const bar = document.getElementById('type-bar');
    let html = `
      <span class="type-label">Print mode:</span>
      <select class="type-select" id="mode-select" onchange="setPrintMode(this.value)">
        <option value="postcard" ${printMode === 'postcard' ? 'selected' : ''}>💌 Full Postcard</option>
        <option value="qr_only" ${printMode === 'qr_only' ? 'selected' : ''}>📱 QR Code Only</option>
      </select>`;

    if (printMode === 'postcard') {
      const cat = POSTCARD_TYPES[currentCategory];
      html += '<span class="type-label">Postcard design:</span>' +
        '<select class="type-select" id="type-select" onchange="setPostcardCategory(this.value)">' +
        Object.entries(POSTCARD_TYPES).map(([key, t]) =>
          `<option value="${key}"${key === currentCategory ? ' selected' : ''}>${t.label}</option>`
        ).join('') +
        '</select>';
      if (cat.variants.length > 1) {
        html += '<select class="type-select" id="variant-select" onchange="setPostcardVariant(this.value)">' +
          cat.variants.map(v =>
            `<option value="${v.key}"${v.key === currentVariant ? ' selected' : ''}>${v.label}</option>`
          ).join('') +
          '</select>';
      }
    }
    html += '<button class="btn" style="font-size:0.85rem; padding:10px 18px;" onclick="printSelectedPostcards()">🖨️ Print Selected</button>';
    bar.innerHTML = html;
  }
  function setPostcardCategory(key) {
    if (!POSTCARD_TYPES[key]) return;
    currentCategory = key;
    currentVariant = POSTCARD_TYPES[key].variants[0].key;
    renderTypeBar();
    checkAssets();
    renderPreview();
  }
  function setPostcardVariant(key) {
    currentVariant = key;
    checkAssets();
    renderPreview();
  }

  // Print/lock state. The DATABASE (via /api/admin/cards' printStatus) is
  // the source of truth — once a card has printed_at set, the backend locks
  // it: a postcard_staff account gets a 409 on any further print attempt for
  // that ID, no matter which design. Only an admin account can reprint or
  // explicitly unlock. localStorage is kept only as an offline fallback so
  // the grid still shows something useful if the backend is unreachable.
  const PC_PRINTED_KEY = 'f27_postcard_printed_ids';
  let printStatusMap = {}; // id -> {category, variant, printedAt, locked}
  function getPcPrintedMap() {
    try { return JSON.parse(localStorage.getItem(PC_PRINTED_KEY)) || {}; }
    catch { return {}; }
  }
  function setPcPrintedMap(map) { localStorage.setItem(PC_PRINTED_KEY, JSON.stringify(map)); }

  // Records a print for one ID. Since a locked ID can only ever move
  // forward one at a time, calls are sent sequentially so a 409 on one card
  // doesn't race with others; markPcPrinted() reports back which IDs were
  // actually recorded vs rejected as already-locked.
  async function markPcPrinted(ids, category, variant) {
    const map = getPcPrintedMap();
    const printedAt = new Date().toISOString();
    const locked = [];
    for (const id of ids) {
      const ok = await syncPrintedDesignToBackend(id, category, variant, printedAt);
      if (ok) {
        map[id] = { printed: true, category: category || null, variant: variant || null, printedAt };
        printStatusMap[id] = { category: category || null, variant: variant || null, printedAt, locked: true };
      } else {
        locked.push(id);
      }
    }
    setPcPrintedMap(map);
    renderGrid();
    if (locked.length) {
      alert(`🔒 ${locked.length} card${locked.length > 1 ? 's were' : ' was'} already printed and locked, so ${locked.length > 1 ? "they weren't" : "it wasn't"} recorded again:\n${locked.join(', ')}\n\nAn admin can unlock a card from its card tile if it genuinely needs a reprint.`);
    }
  }

  // Persists the design tag server-side (the actual lock lives here, in the
  // `gifts` table — see server.js). Returns true if it was recorded, false
  // if the backend rejected it because the card is already locked.
  async function syncPrintedDesignToBackend(id, category, variant, printedAt) {
    try {
      const res = await apiFetch(`${BACKEND_API_BASE}/api/admin/cards/${encodeURIComponent(id)}/design`, {
        method: 'PATCH',
        body: JSON.stringify({ design_category: category || null, design_variant: variant || null, printed_at: printedAt }),
      });
      if (res.status === 409) return false;
      return res.ok;
    } catch (err) {
      return true; // backend unreachable — don't block the local/offline flow
    }
  }

  // Admin-only: clears a card's lock so it can be printed again.
  async function unlockCard(id) {
    if (currentRole !== 'admin') return;
    if (!confirm(`Unlock ${id}? It'll be printable again (any design).`)) return;
    try {
      const res = await apiFetch(`${BACKEND_API_BASE}/api/admin/cards/${encodeURIComponent(id)}/design`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Unlock failed.');
      delete printStatusMap[id];
      const map = getPcPrintedMap();
      delete map[id];
      setPcPrintedMap(map);
      renderGrid();
    } catch (err) {
      alert(`⚠️ Could not unlock ${id}: ${err.message}`);
    }
  }

  function authHeaders(extra = {}) {
    const token = getAuthToken();
    return { 'Content-Type': 'application/json', ...(token ? { 'Authorization': `Bearer ${token}` } : {}), ...extra };
  }
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, { ...options, headers: authHeaders(options.headers || {}) });
    if (res.status === 401) {
      sessionStorage.removeItem(SESSION_KEY);
      window.location.replace('login-postcards.html');
      throw new Error('Session expired.');
    }
    return res;
  }

  function isCardSold(id) {
    const buyer = buyerMap[id];
    return !!(buyer && (buyer.buyerName || buyer.buyerContact || buyer.buyerNote || (buyer.price !== null && buyer.price !== undefined)));
  }
  function sortIdsAscending(ids) {
    return [...ids].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  }
  function buildWatchUrl(id) {
    // Strip this file's own name from the path so it works under any filename/folder.
    const base = window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
    return `${base}watch.html?id=${id}`;
  }

  async function loadCardsFromDatabase() {
    const grid = document.getElementById('pc-grid-container');
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px;">⏳ Loading cards from database...</div>`;
    try {
      const response = await apiFetch(`${BACKEND_API_BASE}/api/admin/cards`);
      if (!response.ok) throw new Error('Failed to load cards from database.');
      const data = await response.json();
      localRegistry = data.ids || [];
      buyerMap = data.buyers || {};
      printStatusMap = data.printStatus || {};
      if (!currentRole && data.role) currentRole = data.role;
      // Merge server truth into the local cache so getPcPrintedMap() (used
      // for the grid badges/filters) reflects the database, not just this
      // browser's print history.
      const localMap = getPcPrintedMap();
      Object.entries(printStatusMap).forEach(([id, info]) => {
        localMap[id] = { printed: true, category: info.category, variant: info.variant, printedAt: info.printedAt };
      });
      setPcPrintedMap(localMap);
    } catch (err) {
      console.warn('Could not load cards from DB:', err);
      localRegistry = [];
      buyerMap = {};
    }
    renderGrid();
  }

  function setFilter(filter) {
    currentFilter = filter;
    ['unsold', 'all', 'sold', 'pc-no', 'pc-yes'].forEach(f => {
      document.getElementById(`filter-${f}`).classList.toggle('active', f === filter);
    });
    renderGrid();
  }

  function visibleIdsForFilter() {
    const pcMap = getPcPrintedMap();
    return sortIdsAscending(localRegistry).filter(id => {
      if (currentFilter === 'unsold') return !isCardSold(id);
      if (currentFilter === 'sold') return isCardSold(id);
      if (currentFilter === 'pc-no') return !pcMap[id];
      if (currentFilter === 'pc-yes') return !!pcMap[id];
      return true;
    });
  }

  function updateFilterCounts() {
    const pcMap = getPcPrintedMap();
    const unsold = localRegistry.filter(id => !isCardSold(id)).length;
    const sold = localRegistry.length - unsold;
    const pcYes = localRegistry.filter(id => pcMap[id]).length;
    const pcNo = localRegistry.length - pcYes;
    document.getElementById('count-all').textContent = `(${localRegistry.length})`;
    document.getElementById('count-unsold').textContent = `(${unsold})`;
    document.getElementById('count-sold').textContent = `(${sold})`;
    document.getElementById('count-pc-no').textContent = `(${pcNo})`;
    document.getElementById('count-pc-yes').textContent = `(${pcYes})`;
  }

  function updateSelectedCount() {
    document.getElementById('selected-count').textContent = `${selectedIds.size} selected`;
    document.getElementById('print-selected-btn').disabled = selectedIds.size === 0;
    document.getElementById('pdf-selected-btn').disabled = selectedIds.size === 0;
  }

  // A locked card (already printed) can't be selected for another print
  // run, full stop — including admin accounts. To print it again (e.g. a
  // different design), an admin must explicitly hit "Unlock" on that card
  // first; there's no other way around the lock.
  function isLocked(id) {
    return !!printStatusMap[id];
  }
  function toggleSelect(id) {
    if (isLocked(id)) return;
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    renderGrid();
  }
  function selectAllVisible() {
    visibleIdsForFilter().forEach(id => { if (!isLocked(id)) selectedIds.add(id); });
    renderGrid();
  }
  function clearSelection() {
    selectedIds.clear();
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('pc-grid-container');
    grid.innerHTML = '';
    updateFilterCounts();
    updateSelectedCount();

    if (localRegistry.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px;">No registered cards found. Generate some in the main dashboard first.</div>`;
      return;
    }

    const ids = visibleIdsForFilter();
    if (ids.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:40px;">No cards match this filter.</div>`;
      return;
    }

    const pcMap = getPcPrintedMap();
    ids.forEach(id => {
      const sold = isCardSold(id);
      const pcEntry = pcMap[id];
      const pcPrinted = !!pcEntry;
      // Older entries were just `true`; newer ones are an object with design info.
      let designLabel = '';
      let badgeVerb = 'Postcard printed';
      if (pcEntry && typeof pcEntry === 'object' && pcEntry.category) {
        if (pcEntry.category === 'qr_only') {
          badgeVerb = 'QR only printed';
        } else {
          designLabel = ` (${pcEntry.category}${pcEntry.variant && pcEntry.variant !== 'default' ? ' — ' + pcEntry.variant : ''})`;
        }
      }
      const locked = isLocked(id);
      const tile = document.createElement('div');
      tile.className = 'pc-tile' + (selectedIds.has(id) ? ' selected' : '') + (locked ? ' locked' : '');
      tile.onclick = () => toggleSelect(id);
      const unlockBtn = (pcPrinted && currentRole === 'admin')
        ? `<button class="pc-unlock-btn" title="Unlock — allow reprinting this card" onclick="event.stopPropagation(); unlockCard('${id}')">🔓 Unlock</button>`
        : '';
      tile.innerHTML = `
        <div class="pc-tile-top">
          <input type="checkbox" ${selectedIds.has(id) ? 'checked' : ''} ${locked ? 'disabled' : ''} onclick="event.stopPropagation(); toggleSelect('${id}')">
          <span class="pc-id">${id}</span>
        </div>
        <div class="pc-badges">
          <span class="pc-badge ${sold ? 'sold' : 'unsold'}">${sold ? 'Sold' : 'Unsold'}</span>
          <span class="pc-badge ${pcPrinted ? 'printed' : 'not-printed'}" title="${designLabel}">${pcPrinted ? (locked ? '🔒 ' : '') + badgeVerb + designLabel : 'Not printed'}</span>
        </div>
        ${unlockBtn}`;
      grid.appendChild(tile);
    });
  }

  // Renders a QR code for `text` into a detached container and returns a PNG data URL.
  function generateQrDataUrl(text, size) {
    const tempContainer = document.createElement('div');
    tempContainer.style.position = 'fixed';
    tempContainer.style.left = '-9999px';
    tempContainer.style.top = '-9999px';
    document.body.appendChild(tempContainer);
    new QRCode(tempContainer, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    const canvas = tempContainer.querySelector('canvas');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : null;
    document.body.removeChild(tempContainer);
    return dataUrl;
  }

  // Defense in depth: the UI already disables locked cards, but this
  // re-checks right before anything actually prints, in case the lock
  // state changed since the grid last loaded (e.g. someone else printed it
  // from another device a minute ago). Returns the IDs still OK to print,
  // or null if nothing is left to do.
  function guardAgainstLocked(ids) {
    const blocked = ids.filter(id => printStatusMap[id]);
    const allowed = ids.filter(id => !printStatusMap[id]);
    if (blocked.length) {
      alert(`🔒 ${blocked.length} of the selected card${ids.length > 1 ? 's' : ''} ${blocked.length > 1 ? 'are' : 'is'} already printed and locked, so ${blocked.length > 1 ? "they won't" : "it won't"} be included:\n${blocked.join(', ')}`);
    }
    if (allowed.length === 0) return null;
    return allowed;
  }

  function printSelectedPostcards() {
    if (selectedIds.size === 0) {
      alert('Check at least one card to print.');
      return;
    }
    const ids = guardAgainstLocked(sortIdsAscending([...selectedIds]));
    if (!ids) return;
    printPostcardsForIds(ids);
  }

  function printPostcardsForIds(ids) {
    if (printMode === 'qr_only') {
      printQrOnlySheet(ids);
      return;
    }
    const dims = PAGE_DIMENSIONS[pageSizeChoice];
    const cssSizeName = pageSizeChoice === 'a5' ? 'A5' : 'A4';
    const design = getCurrentDesign();

    const pagesHtml = ids.map(id => {
      const qrDataUrl = generateQrDataUrl(buildWatchUrl(id), 260);
      return `
        <div class="pc-print-page">
          <img class="pc-bg" src="${design.front}" alt="Front">
        </div>
        <div class="pc-print-page">
          <img class="pc-bg" src="${design.inside}" alt="Inside">
          <div class="pc-qr-overlay">
            <img src="${qrDataUrl}" alt="QR">
            <div class="pc-caption">ስካን አድርገው መልዕክትዎን ይላኩ/ይቀበሉ፡፡<br>Scan to send/receive your message</div>
            <div class="pc-id-caption">${id}</div>
          </div>
        </div>`;
    }).join('');

    const printWin = window.open('', '_blank', 'width=900,height=700');
    if (!printWin) {
      alert('⚠️ Your browser blocked the print popup. Please allow popups for this site and try again.');
      return;
    }

    printWin.document.write(`
      <!DOCTYPE html>
      <html><head><title>Print Postcards</title>
      <style>
        @page { size: ${cssSizeName} landscape; margin: 0; }
        html, body { height: 100%; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'DM Sans', sans-serif; }
        .pc-print-page {
          width: ${dims.w}mm; height: ${dims.h}mm; position: relative; overflow: hidden;
          page-break-after: always;
        }
        .pc-print-page:last-child { page-break-after: auto; }
        .pc-print-page img.pc-bg {
          position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
        }
        .pc-qr-overlay {
          position: absolute; left: 61%; top: 56%; width: 15%;
          display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .pc-qr-overlay img { width: 100%; height: auto; display: block; background: #fff; }
        .pc-qr-overlay .pc-caption { margin-top: 6px; font-weight: 600; font-size: 9px; line-height: 1.3; color: #333; }
        .pc-qr-overlay .pc-id-caption { margin-top: 2px; font-family: monospace; font-weight: 700; font-size: 8px; color: #555; }
      </style>
      </head><body>${pagesHtml}</body></html>
    `);
    printWin.document.close();

    printWin.onload = () => { printWin.focus(); printWin.print(); };
    printWin.addEventListener('afterprint', () => {
      markPcPrinted(ids, currentCategory, currentVariant);
      renderGrid();
      printWin.close();
    });
  }

  // Plain QR-code-only label sheet — no postcard artwork. Labels flow in a
  // grid and wrap onto extra pages automatically as needed.
  function printQrOnlySheet(ids) {
    const cssSizeName = pageSizeChoice === 'a5' ? 'A5' : 'A4';

    const labelsHtml = ids.map(id => {
      const qrDataUrl = generateQrDataUrl(buildWatchUrl(id), 260);
      return `
        <div class="qr-label">
          <img src="${qrDataUrl}" alt="QR">
          <div class="qr-label-caption">ስካን አድርገው መልዕክትዎን ይላኩ/ይቀበሉ፡፡<br>Scan to send/receive your message</div>
          <div class="qr-label-id">${id}</div>
        </div>`;
    }).join('');

    const printWin = window.open('', '_blank', 'width=900,height=700');
    if (!printWin) {
      alert('⚠️ Your browser blocked the print popup. Please allow popups for this site and try again.');
      return;
    }

    printWin.document.write(`
      <!DOCTYPE html>
      <html><head><title>Print QR Codes</title>
      <style>
        @page { size: ${cssSizeName} landscape; margin: 8mm; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'DM Sans', sans-serif; }
        .qr-sheet { display: flex; flex-wrap: wrap; align-content: flex-start; }
        .qr-label {
          width: 45mm; height: 55mm; margin: 4mm;
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          border: 1px dashed #ccc; border-radius: 3mm;
          page-break-inside: avoid;
        }
        .qr-label img { width: 28mm; height: 28mm; background: #fff; }
        .qr-label-caption { margin-top: 3mm; font-weight: 600; font-size: 8px; line-height: 1.3; color: #333; padding: 0 2mm; }
        .qr-label-id { margin-top: 2mm; font-family: monospace; font-weight: 700; font-size: 9px; color: #555; }
      </style>
      </head><body><div class="qr-sheet">${labelsHtml}</div></body></html>
    `);
    printWin.document.close();

    printWin.onload = () => { printWin.focus(); printWin.print(); };
    printWin.addEventListener('afterprint', () => {
      markPcPrinted(ids, 'qr_only', null);
      renderGrid();
      printWin.close();
    });
  }

  // --- PDF generation (for sending to a print shop) ---------------------
  // Loads love.png / love-inside.png once as real <img> elements so we can
  // draw them into <canvas> (needed to embed full-res pixels into the PDF
  // and to burn the QR + captions into the inside page).
  const artworkPromiseCache = {};
  function loadImageElement(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error(`Could not load ${src}`));
      img.src = src;
    });
  }
  function loadArtwork(design, cacheKey) {
    if (!artworkPromiseCache[cacheKey]) {
      artworkPromiseCache[cacheKey] = Promise.all([loadImageElement(design.front), loadImageElement(design.inside)])
        .then(([front, inside]) => ({ front, inside }));
    }
    return artworkPromiseCache[cacheKey];
  }

  // Draws the inside artwork + QR + captions onto a full-resolution canvas
  // (matching the source artwork's pixel size, ~300dpi for A4) and returns it.
  function buildInsidePageCanvas(insideImg, id) {
    const canvas = document.createElement('canvas');
    canvas.width = insideImg.naturalWidth;
    canvas.height = insideImg.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(insideImg, 0, 0, canvas.width, canvas.height);

    // QR code, rendered via qrcode.js into its own canvas so we can draw
    // it straight onto the composite without an extra image-load round trip.
    const qrSize = Math.round(canvas.width * 0.15);
    const tempContainer = document.createElement('div');
    tempContainer.style.position = 'fixed';
    tempContainer.style.left = '-9999px';
    document.body.appendChild(tempContainer);
    new QRCode(tempContainer, { text: buildWatchUrl(id), width: qrSize, height: qrSize, correctLevel: QRCode.CorrectLevel.M });
    const qrCanvas = tempContainer.querySelector('canvas');
    const qrX = Math.round(canvas.width * 0.61);
    const qrY = Math.round(canvas.height * 0.56);
    // White backing so the QR stays scannable over the cream background.
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16);
    ctx.drawImage(qrCanvas, qrX, qrY, qrSize, qrSize);
    document.body.removeChild(tempContainer);

    // Captions below the QR — canvas text uses the browser's normal font
    // fallback, so the Amharic line renders the same as it does on-screen.
    ctx.textAlign = 'center';
    const centerX = qrX + qrSize / 2;
    ctx.fillStyle = '#333333';
    ctx.font = `600 ${Math.round(canvas.width * 0.0097)}px 'DM Sans', sans-serif`;
    ctx.fillText('ስካን አድርገው መልዕክትዎን ይላኩ/ይቀበሉ፡፡', centerX, qrY + qrSize + Math.round(canvas.width * 0.018));
    ctx.fillText('Scan to send/receive your message', centerX, qrY + qrSize + Math.round(canvas.width * 0.033));
    ctx.fillStyle = '#555555';
    ctx.font = `700 ${Math.round(canvas.width * 0.0085)}px monospace`;
    ctx.fillText(id, centerX, qrY + qrSize + Math.round(canvas.width * 0.047));

    return canvas;
  }

  async function downloadPostcardsPdf() {
    if (selectedIds.size === 0) return;
    const ids = guardAgainstLocked(sortIdsAscending([...selectedIds]));
    if (!ids) return;
    const pdfBtn = document.getElementById('pdf-selected-btn');
    const originalLabel = pdfBtn.textContent;
    pdfBtn.disabled = true;
    pdfBtn.textContent = '⏳ Building PDF...';

    try {
      await document.fonts.ready;
      const { jsPDF } = window.jspdf;
      const dims = PAGE_DIMENSIONS[pageSizeChoice];
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: pageSizeChoice });

      if (printMode === 'qr_only') {
        buildQrOnlySheetPdf(doc, ids, dims);
        markPcPrinted(ids, 'qr_only', null);
      } else {
        const { front, inside } = await loadArtwork(getCurrentDesign(), currentDesignKey());
        ids.forEach((id, i) => {
          if (i > 0) doc.addPage(pageSizeChoice, 'landscape');
          doc.addImage(front, 'PNG', 0, 0, dims.w, dims.h, undefined, 'FAST');
          doc.addPage(pageSizeChoice, 'landscape');
          const insideCanvas = buildInsidePageCanvas(inside, id);
          doc.addImage(insideCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, dims.w, dims.h);
        });
        markPcPrinted(ids, currentCategory, currentVariant);
      }

      const stamp = new Date().toISOString().slice(0, 10);
      doc.save(`postcards-${pageSizeChoice}-${stamp}.pdf`);
      renderGrid();
    } catch (err) {
      console.error(err);
      alert(`⚠️ Could not build the PDF: ${err.message}`);
    } finally {
      pdfBtn.disabled = selectedIds.size === 0;
      pdfBtn.textContent = originalLabel;
    }
  }

  // Lays out a grid of QR-code labels (no artwork) across as many pages as
  // needed. Mirrors the sizing used in printQrOnlySheet (45mm x 55mm cells).
  function buildQrOnlySheetPdf(doc, ids, dims) {
    const margin = 8, cellW = 49, cellH = 59; // includes the label's own 4mm margin
    const cols = Math.max(1, Math.floor((dims.w - margin * 2) / cellW));
    const rows = Math.max(1, Math.floor((dims.h - margin * 2) / cellH));
    const perPage = cols * rows;

    ids.forEach((id, i) => {
      if (i > 0 && i % perPage === 0) doc.addPage(pageSizeChoice, 'landscape');
      const posOnPage = i % perPage;
      const col = posOnPage % cols;
      const row = Math.floor(posOnPage / cols);
      const x = margin + col * cellW;
      const y = margin + row * cellH;

      const qrPx = 300;
      const tempContainer = document.createElement('div');
      tempContainer.style.position = 'fixed';
      tempContainer.style.left = '-9999px';
      document.body.appendChild(tempContainer);
      new QRCode(tempContainer, { text: buildWatchUrl(id), width: qrPx, height: qrPx, correctLevel: QRCode.CorrectLevel.M });
      const qrCanvas = tempContainer.querySelector('canvas');
      const qrDataUrl = qrCanvas.toDataURL('image/png');
      document.body.removeChild(tempContainer);

      const qrSizeMm = 28;
      const qrX = x + (cellW - 4 - qrSizeMm) / 2;
      doc.addImage(qrDataUrl, 'PNG', qrX, y + 4, qrSizeMm, qrSizeMm);

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('Scan to send/receive your message', x + (cellW - 4) / 2, y + qrSizeMm + 10, { align: 'center', maxWidth: cellW - 6 });
      doc.setFontSize(8);
      doc.text(id, x + (cellW - 4) / 2, y + qrSizeMm + 16, { align: 'center' });

      doc.setDrawColor(200);
      doc.roundedRect(x, y, cellW - 4, cellH - 4, 2, 2, 'S');
    });
  }

  // Checks that the currently selected design's two artwork files are
  // reachable next to this page. Re-run whenever the type selector changes.
  function checkAssets() {
    const warningBox = document.getElementById('assets-warning');
    warningBox.style.display = 'none';
    if (printMode === 'qr_only') return; // no artwork files needed in this mode
    const design = getCurrentDesign();
    const files = [design.front, design.inside];
    let missing = [];
    let checked = 0;
    files.forEach(src => {
      const img = new Image();
      const done = (ok) => {
        checked++;
        if (!ok) missing.push(src);
        if (checked === files.length && missing.length > 0) {
          warningBox.innerHTML = `⚠️ Couldn't load ${missing.map(f => `<strong>${f}</strong>`).join(' / ')}. Make sure ${missing.length > 1 ? 'both files are' : 'this file is'} uploaded to the same folder as this page, then reload.`;
          warningBox.style.display = 'block';
        }
      };
      img.onload = () => done(true);
      img.onerror = () => done(false);
      img.src = src;
    });
  }

  renderTypeBar();
  checkAssets();
  renderPreview();
  loadCardsFromDatabase();
</script>
</body>
</html>
