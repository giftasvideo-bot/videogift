<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffe9f1; --ink:#4a1230; --a:#e0457b; --b:#ffb703; --c:#5cc8c0; --d:#8e6bd8; --card:#fffdfb; }
  body[data-theme=blue] { --bg:#e0f0ff; --ink:#0f2a4d; --a:#2f7de1; --b:#ffb703; --c:#ff7a8a; --d:#4cc9a7; }
  body[data-theme=white] { --bg:#fffaf3; --ink:#2b2230; --a:#7a4fd6; --b:#f25c54; --c:#2bb3a3; --d:#ffb703; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { min-height:100svh; background:var(--bg); color:var(--ink); font-family:'Nunito','Noto Sans Ethiopic',system-ui,sans-serif; line-height:1.55; overflow-x:hidden; }
  body.am { font-family:'Noto Sans Ethiopic','Nunito',sans-serif; }
  .sky { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .sky svg { position:absolute; bottom:-160px; opacity:.5; animation:rise linear infinite; }
  @keyframes rise { to { transform:translateY(-135vh) translateX(var(--dx,20px)); } }
  main { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:env(safe-area-inset-top,0px) 20px max(24px, env(safe-area-inset-bottom)); text-align:center; }
  .lang { display:flex; justify-content:flex-end; gap:6px; padding-top:8px; }
  .lang button { font:inherit; font-size:.85rem; border:2px solid var(--ink); background:transparent; color:var(--ink); border-radius:999px; padding:3px 12px; cursor:pointer; }
  .lang button[aria-pressed=true] { background:var(--ink); color:var(--bg); }
  .lang button:focus-visible, .btn:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  .cluster { display:block; width:min(320px,80%); height:auto; margin:0 auto; overflow:visible; }
  .cluster .bl { transform-box:fill-box; transform-origin:50% 100%; animation:bob 3.6s ease-in-out infinite alternate; }
  .cluster .bl:nth-child(2n) { animation-delay:-1.6s; } .cluster .bl:nth-child(3n) { animation-delay:-2.6s; }
  @keyframes bob { from { transform:rotate(-3deg) translateY(2px); } to { transform:rotate(3deg) translateY(-5px); } }
  .say { margin:4px 0 0; font-size:1.05rem; }
  h1 { font-family:'Baloo 2','Noto Sans Ethiopic',sans-serif; font-weight:800; font-size:clamp(2.4rem,11vw,4rem); line-height:1.05; margin:6px 0 8px; color:var(--a); text-wrap:balance; }
  body.am h1 { font-family:'Noto Sans Ethiopic',sans-serif; line-height:1.25; }
  .host { margin:0 0 22px; opacity:.85; }
  .bphoto { position:relative; width:min(250px,68vw); margin:0 auto 54px; }
  .bphoto .pic { aspect-ratio:.86; border-radius:50% 50% 50% 50% / 58% 58% 42% 42%; background:var(--card) center/cover no-repeat; border:7px solid var(--card); box-shadow:0 0 0 5px var(--a), 0 14px 28px rgba(0,0,0,.2); }
  .bphoto::before { content:""; position:absolute; left:50%; bottom:-14px; margin-left:-11px; border:11px solid transparent; border-bottom:14px solid var(--a); border-top:0; }
  .bphoto::after { content:""; position:absolute; left:50%; bottom:-48px; width:2px; height:36px; background:var(--ink); opacity:.5; }
  .when { background:var(--card); border-radius:26px; padding:22px 18px; margin:0 0 16px; box-shadow:0 6px 0 var(--a); }
  .when .big { font-family:'Baloo 2','Noto Sans Ethiopic',sans-serif; font-weight:800; font-size:1.55rem; line-height:1.2; margin:0; }
  .when .sm { margin:4px 0 0; font-size:1.05rem; }
  .where { background:var(--card); border-radius:26px; padding:20px 18px; margin:0 0 16px; box-shadow:0 6px 0 var(--c); }
  .where p { margin:0 0 12px; font-weight:700; }
  .btn { display:inline-block; font:inherit; font-weight:700; text-decoration:none; background:var(--a); color:#fff; border:0; border-radius:999px; padding:10px 22px; }
  .prog { list-style:none; padding:0; margin:0 0 16px; display:grid; gap:8px; text-align:left; }
  .prog li { background:var(--card); border-radius:999px; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  .prog li::before { content:""; flex:0 0 18px; height:22px; border-radius:50% 50% 50% 50% / 58% 58% 42% 42%; background:var(--b); }
  .prog li:nth-child(3n+2)::before { background:var(--c); } .prog li:nth-child(3n)::before { background:var(--d); }
  .prog b { margin-right:auto; }
  .msg { font-size:1.1rem; margin:22px 4px; white-space:pre-line; text-wrap:pretty; }
  .gal { display:flex; gap:16px; overflow-x:auto; scroll-snap-type:x mandatory; padding:14px 20px 26px; margin:0 -20px; }
  .gal img { flex:0 0 auto; width:min(210px,62vw); aspect-ratio:3/4; object-fit:cover; scroll-snap-align:center; background:var(--card); padding:8px 8px 30px; border-radius:6px; box-shadow:0 8px 18px rgba(0,0,0,.2); }
  .gal img:nth-child(odd) { transform:rotate(-2.5deg); } .gal img:nth-child(even) { transform:rotate(2deg); }
  .dolls { display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:30px 0 0; }
  .dolls svg { animation:wob 2.8s ease-in-out infinite alternate; transform-origin:50% 100%; }
  .dolls svg:nth-child(2) { animation-delay:-.9s; } .dolls svg:nth-child(3) { animation-delay:-1.8s; }
  @keyframes wob { from { transform:rotate(-4deg); } to { transform:rotate(4deg); } }
  .err { padding:40px 0; font-weight:700; }
  @media (prefers-reduced-motion:reduce) { .sky svg, .cluster .bl, .dolls svg { animation:none; } .sky svg { bottom:auto; top:20%; } }
</style>
</head>
<body data-theme="pink">
<div class="sky" id="sky" aria-hidden="true"></div>
<main>
  <div class="lang"><button id="bEn" type="button">English</button><button id="bAm" type="button" lang="am">አማርኛ</button></div>
  <div id="content"></div>
</main>
<script>
const API = 'https://videogift-backend-3.onrender.com';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);

/* Ethiopian calendar */
const EM = ['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜን'];
const g2j = (y, m, d) => { const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3; return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045; };
const j2e = j => { const k = j - 1723856, r = ((k % 1461) + 1461) % 1461, n = (r % 365) + 365 * Math.floor(r / 1460); return { y:4 * Math.floor(k / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), m:Math.floor(n / 30) + 1, d:(n % 30) + 1 }; };

const T = {
  en: { say:'Come celebrate with us!', host:'Hosted by', map:'Open map', prog:'Party plan', err:'We could not load this invitation.' },
  am: { say:'መጥታችሁ አብራችሁን አክብሩ!', host:'ጋባዦች', map:'ካርታ ክፈት', prog:'የበዓሉ ፕሮግራም', err:'ይህን ግብዣ መጫን አልተቻለም።' }
};
const WD_AM = ['እሑድ','ሰኞ','ማክሰኞ','ረቡዕ','ሐሙስ','ዓርብ','ቅዳሜ'];
const WD_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let lang = qs.get('lang') || localStorage.getItem('f27_lang') || 'en'; if (lang !== 'am') lang = 'en';
let ev = null;

const DEMO = {
  title:'Liya turns 7!', title_am:'ሊያ 7 ዓመት ሞላት!', host_names:'Mum, Dad & Nahom', host_names_am:'እማማ፣ አባባ እና ናሆም',
  event_date:'2026-12-12T15:00', venue:'Our home, Bole, Addis Ababa', venue_am:'ቤታችን፣ ቦሌ፣ አዲስ አበባ', map_url:'https://maps.google.com/?q=Bole+Addis+Ababa',
  message:'Cake, games and a piñata! Bring your biggest smile.', message_am:'ኬክ፣ ጨዋታ እና ብዙ ደስታ! ፈገግታችሁን ይዛችሁ ኑ።',
  days:[{ title:'Games', title_am:'ጨዋታ', date:'2026-12-12', start:'15:00' }, { title:'Cake time', title_am:'የኬክ ሰዓት', date:'2026-12-12', start:'17:00' }]
};
const pick = (o, k) => (lang === 'am' && o[k + '_am']) ? o[k + '_am'] : (o[k] || '');
const pad = n => String(n).padStart(2, '0');
function parseDate(s) { const m = /^(\d{4})-(\d\d)-(\d\d)(?:[T ](\d\d):(\d\d))?/.exec(s || ''); return m ? { y:+m[1], m:+m[2], d:+m[3], hh:m[4] != null ? +m[4] : null, mm:m[5] != null ? +m[5] : null } : null; }
function dateText(p) {
  const wd = new Date(p.y, p.m - 1, p.d).getDay();
  if (lang === 'am') { const e = j2e(g2j(p.y, p.m, p.d)); return WD_AM[wd] + '፣ ' + EM[e.m - 1] + ' ' + e.d + ' ቀን ' + e.y + ' ዓ.ም'; }
  return WD_EN[wd] + ', ' + p.d + ' ' + MO_EN[p.m - 1] + ' ' + p.y;
}
function timeText(p) {
  if (p.hh == null) return '';
  const h12 = p.hh % 12 || 12;
  return lang === 'am' ? h12 + ':' + pad(p.mm) + (p.hh < 12 ? ' ጠዋት' : ' ከሰዓት') : h12 + ':' + pad(p.mm) + (p.hh < 12 ? ' AM' : ' PM');
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const src = u => /^(https?:|data:|blob:)/i.test(u) ? u : API + (u.startsWith('/') ? '' : '/') + u;
const cols = () => { const cs = getComputedStyle(document.body); return ['--a', '--b', '--c', '--d'].map(v => cs.getPropertyValue(v).trim()); };

/* balloon cluster tied with a bow */
function cluster() {
  const C = cols(), B = [[60,60,40,C[0]], [135,42,44,C[1]], [210,36,46,C[2]], [285,48,42,C[3]], [345,70,36,C[0]]];
  let s = '<svg class="cluster" viewBox="0 0 400 190" aria-hidden="true">';
  B.forEach(b => { s += '<path d="M' + b[0] + ' ' + (b[1] + 56) + ' Q' + (b[0] + (200 - b[0]) * .4) + ' 130 200 160" fill="none" stroke="' + C[0] + '" stroke-opacity=".0"/><path d="M' + b[0] + ' ' + (b[1] + b[2] * 1.3) + ' Q' + (b[0] + (200 - b[0]) * .3) + ' 125 200 162" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.6"/>'; });
  B.forEach(b => { const x = b[0], y = b[1], r = b[2];
    s += '<g class="bl"><ellipse cx="' + x + '" cy="' + y + '" rx="' + r + '" ry="' + r * 1.25 + '" fill="' + b[3] + '"/><path d="M' + (x - 5) + ' ' + (y + r * 1.25 + 6) + ' L' + x + ' ' + (y + r * 1.25 - 2) + ' L' + (x + 5) + ' ' + (y + r * 1.25 + 6) + 'Z" fill="' + b[3] + '"/><ellipse cx="' + (x - r * .4) + '" cy="' + (y - r * .5) + '" rx="' + r * .16 + '" ry="' + r * .3 + '" fill="#fff" opacity=".55" transform="rotate(25 ' + (x - r * .4) + ' ' + (y - r * .5) + ')"/></g>'; });
  s += '<path d="M200 162 L178 150 L178 176Z M200 162 L222 150 L222 176Z" fill="' + C[1] + '"/><circle cx="200" cy="162" r="5" fill="' + C[0] + '"/></svg>';
  return s;
}
/* little nesting dolls */
function doll(body, scarf, h) {
  return '<svg viewBox="0 0 80 110" width="' + h * .73 + '" height="' + h + '" aria-hidden="true"><path d="M40 6C26 6 16 18 16 34c0 6 2 10 4 14C10 56 6 70 6 86c0 12 10 20 34 20s34-8 34-20c0-16-4-30-14-38 2-4 4-8 4-14C64 18 54 6 40 6z" fill="' + body + '"/><circle cx="40" cy="40" r="17" fill="#ffe2c8"/><path d="M23 38c0-14 8-22 17-22s17 8 17 22c-4-8-10-12-17-12s-13 4-17 12z" fill="' + scarf + '"/><circle cx="34" cy="43" r="2" fill="#4a1230"/><circle cx="46" cy="43" r="2" fill="#4a1230"/><circle cx="29" cy="49" r="3" fill="#ff8fa3" opacity=".7"/><circle cx="51" cy="49" r="3" fill="#ff8fa3" opacity=".7"/><path d="M36 50q4 3 8 0" stroke="#4a1230" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="40" cy="84" rx="15" ry="17" fill="' + scarf + '"/><g fill="#fff"><circle cx="40" cy="78" r="3.5"/><circle cx="34" cy="84" r="3.5"/><circle cx="46" cy="84" r="3.5"/><circle cx="40" cy="90" r="3.5"/></g><circle cx="40" cy="84" r="3" fill="' + body + '"/></svg>';
}
/* rising balloons in the background */
function sky() {
  const C = cols(), el = $('sky'); let s = '';
  for (let i = 0; i < 12; i++) { const w = 34 + (i * 7) % 26, c = C[i % 4], dur = 16 + (i * 5) % 14;
    s += '<svg viewBox="0 0 40 80" width="' + w + '" style="left:' + (4 + i * 8) + '%;animation-duration:' + dur + 's;animation-delay:-' + (i * 3 % dur) + 's;--dx:' + (i % 2 ? 24 : -24) + 'px"><ellipse cx="20" cy="20" rx="16" ry="20" fill="' + c + '"/><path d="M16 42h8l-4-4z" fill="' + c + '"/><path d="M20 42q-6 14 0 36" fill="none" stroke="currentColor" stroke-opacity=".4"/></svg>'; }
  el.style.color = getComputedStyle(document.body).color; el.innerHTML = s;
}
function render() {
  const t = T[lang], c = $('content'); document.body.classList.toggle('am', lang === 'am'); document.documentElement.lang = lang;
  $('bEn').setAttribute('aria-pressed', lang === 'en'); $('bAm').setAttribute('aria-pressed', lang === 'am');
  if (!ev) { c.innerHTML = '<div class="err">' + esc(t.err) + '</div>'; return; }
  const th = qs.get('theme') || ev.theme; document.body.dataset.theme = ['pink', 'blue', 'white'].includes(th) ? th : 'pink';
  sky();
  const C = cols(), p = [], photos = (ev.photo_urls && ev.photo_urls.length) ? ev.photo_urls : (ev.photo_url ? [ev.photo_url] : []);
  p.push(cluster() + '<p class="say">' + esc(t.say) + '</p><h1>' + esc(pick(ev, 'title')) + '</h1>');
  const host = pick(ev, 'host_names'); if (host) p.push('<p class="host">' + esc(t.host) + ' ' + esc(host) + '</p>');
  if (photos[0]) p.push('<div class="bphoto"><div class="pic" role="img" aria-label="" style="background-image:url(\'' + esc(src(photos[0])).replace(/'/g, '%27') + '\')"></div></div>');
  const d = parseDate(ev.event_date);
  if (d) p.push('<div class="when"><p class="big">' + esc(dateText(d)) + '</p>' + (timeText(d) ? '<p class="sm">' + esc(timeText(d)) + '</p>' : '') + '</div>');
  const venue = pick(ev, 'venue');
  if (venue) p.push('<div class="where"><p>' + esc(venue) + '</p>' + (/^https?:\/\//i.test(ev.map_url || '') ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(ev.map_url) + '">' + esc(t.map) + '</a>' : '') + '</div>');
  const days = Array.isArray(ev.days) ? ev.days : [];
  if (days.length > 1 || (days.length === 1 && days[0].title)) p.push('<ul class="prog" aria-label="' + esc(t.prog) + '">' + days.map(x => {
    const tm = x.start ? timeText(parseDate('2000-01-01T' + x.start)) : ''; return '<li><b>' + esc(pick(x, 'title')) + '</b>' + (tm ? '<span>' + esc(tm) + '</span>' : '') + '</li>'; }).join('') + '</ul>');
  const msg = pick(ev, 'message') || pick(ev, 'about').replace(/\s*\[\[tpl:\w+\]\]\s*$/, ''); if (msg) p.push('<p class="msg">' + esc(msg) + '</p>');
  const gal = [...photos.slice(1), ...(Array.isArray(ev.gallery_urls) ? ev.gallery_urls : [])];
  if (gal.length) p.push('<div class="gal">' + gal.map(u => '<img alt="" loading="lazy" src="' + esc(src(u)) + '">').join('') + '</div>');
  p.push('<div class="dolls">' + doll(C[1], C[0], 84) + doll(C[2], C[3], 108) + doll(C[0], C[1], 84) + '</div>');
  c.innerHTML = p.join('');
}
$('bEn').onclick = () => { lang = 'en'; localStorage.setItem('f27_lang', lang); render(); };
$('bAm').onclick = () => { lang = 'am'; localStorage.setItem('f27_lang', lang); render(); };

(async function () {
  const slug = qs.get('e');
  if (!slug) { ev = Object.assign({}, DEMO); if (qs.get('title')) ev.title = qs.get('title'); }
  else { try { const r = await fetch(API + '/api/events/' + encodeURIComponent(slug)); if (!r.ok) throw new Error(r.status); ev = await r.json(); } catch (e) { ev = null; } }
  render();
})();
</script>
</body>
</html>
