<style>

  html, body { margin:0; }

  .gbform textarea { min-height:96px; resize:vertical; }
  .gbform input:focus-visible, .gbform textarea:focus-visible { outline:3px solid var(--a); outline-offset:1px; }
  .gbform .btn { justify-self:center; cursor:pointer; }
  .gbform .btn:disabled { opacity:.6; cursor:default; }
  .gbform .note { margin:0; text-align:center; font-weight:700; min-height:1.3em; }
  .gblist { display:grid; gap:12px; margin-top:16px; text-align:left; }
  .gbit { background:var(--card); border-radius:18px; padding:12px 16px; box-shadow:0 4px 0 var(--b); }
  .gbit .h { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .gbit b { color:var(--a); overflow-wrap:anywhere; } .gbit small { opacity:.65; flex:0 0 auto; }
  .gbit p { margin:4px 0 0; white-space:pre-line; overflow-wrap:anywhere; }
  .gbempty { margin:16px 0 0; opacity:.8; }
  .lb { position:fixed; inset:0; z-index:50; background:rgba(25,10,30,.88); display:flex; align-items:center; justify-content:center; padding:16px; }
  .lb img { max-width:100%; max-height:86svh; border-radius:10px; border:6px solid var(--card); box-shadow:0 14px 40px rgba(0,0,0,.5); }
  .lb button { position:absolute; border:0; border-radius:50%; width:46px; height:46px; font:inherit; font-size:1.5rem; line-height:1; background:#fff; color:#333; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .lb .x { top:max(14px,env(safe-area-inset-top)); right:14px; } .lb .pv { left:10px; top:50%; margin-top:-23px; } .lb .nx { right:10px; top:50%; margin-top:-23px; }
  .lb button:focus-visible { outline:3px solid var(--b); outline-offset:2px; }
  .dolls { display:flex; justify-content:center; align-items:flex-end; gap:6px; margin:30px 0 0; }
  .dolls svg { animation:wob 2.8s ease-in-out infinite alternate; transform-origin:50% 100%; }
  .dolls svg:nth-child(2) { animation-delay:-.9s; } .dolls svg:nth-child(3) { animation-delay:-1.8s; }
  @keyframes wob { from { transform:rotate(-4deg); } to { transform:rotate(4deg); } }
  .err { padding:40px 0; font-weight:700; }
  @media (prefers-reduced-motion:reduce) { .sky svg, .cluster .bl, .dolls svg { animation:none; } .sky svg { bottom:auto; top:20%; } }

const src = u => /^(https?:|data:|blob:)/i.test(u) ? u : API + (u.startsWith('/') ? '' : '/') + u;
const cols = () => { const cs = getComputedStyle(document.body); return ['--a', '--b', '--c', '--d'].map(v => cs.getPropertyValue(v).trim()); };

/* balloon cluster tied with a bow */
function cluster() {
  const C = cols(), B = [[60,60,40,C[0]], [135,42,44,C[1]], [210,36,46,C[2]], [285,48,42,C[3]], [345,70,36,C[0]]];
  let s = '<svg class="cluster" viewBox="0 0 400 190" aria-hidden="true">';
  B.forEach(b => { s += '<path d="M' + b[0] + ' ' + (b[1] + 56) + ' Q' + (b[0] + (200 - b[0]) * .4) + ' 130 200 160" fill="none" stroke="' + C[0] + '" stroke-opacity=".0"/><path d="M' + b[0] + ' ' + (b[1] + b[2] * 1.3) + ' Q' + (b[0] + (200 - b[0]) * .3) + ' 125 200 162" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.6"/>'; });
  B.forEach(b => { const x = b[0], y = b[1], r = b[2];
    s += '<g class="bl"><ellipse cx="' + x + '" cy="' + y + '" rx="' + r + '" ry="' + r * 1.25 + '" fill="' + b[3] + '"/><path d="M' + (x - 5) + ' ' + (y + r * 1.25 + 6) + ' L' + x + ' ' + (y + r * 1.25 - 2) + ' L' + (x + 5) + ' ' + (y + r * 1.25 + 6) + 'Z" fill="' + b[3] + '"/><ellipse cx="' + (x - r * .4) + '" cy="' + (y - r * .5) + '" rx="' + r * .16 + '" ry="' + r * .3 + '" fill="#fff" opacity=".55" transform="rotate(25 ' + (x - r * .4) + ' ' + (y - r * .5) + ')"/></g>'; });
  s += '<path d="M200 162 L178 150 L178 176Z M200 162 L222 150 L222 176Z" fill="' + C[1] + '"/><circle cx="200" cy="162" r="5" fill="' + C[0] + '"/></svg>';
  return s;
}
/* little nesting dolls */
function doll(body, scarf, h) {
  return '<svg viewBox="0 0 80 110" width="' + h * .73 + '" height="' + h + '" aria-hidden="true"><path d="M40 6C26 6 16 18 16 34c0 6 2 10 4 14C10 56 6 70 6 86c0 12 10 20 34 20s34-8 34-20c0-16-4-30-14-38 2-4 4-8 4-14C64 18 54 6 40 6z" fill="' + body + '"/><circle cx="40" cy="40" r="17" fill="#ffe2c8"/><path d="M23 38c0-14 8-22 17-22s17 8 17 22c-4-8-10-12-17-12s-13 4-17 12z" fill="' + scarf + '"/><circle cx="34" cy="43" r="2" fill="#4a1230"/><circle cx="46" cy="43" r="2" fill="#4a1230"/><circle cx="29" cy="49" r="3" fill="#ff8fa3" opacity=".7"/><circle cx="51" cy="49" r="3" fill="#ff8fa3" opacity=".7"/><path d="M36 50q4 3 8 0" stroke="#4a1230" stroke-width="1.6" fill="none" stroke-linecap="round"/><ellipse cx="40" cy="84" rx="15" ry="17" fill="' + scarf + '"/><g fill="#fff"><circle cx="40" cy="78" r="3.5"/><circle cx="34" cy="84" r="3.5"/><circle cx="46" cy="84" r="3.5"/><circle cx="40" cy="90" r="3.5"/></g><circle cx="40" cy="84" r="3" fill="' + body + '"/></svg>';
}
/* rising balloons in the background */
function sky() {
  const C = cols(), el = $('sky'); let s = '';
  for (let i = 0; i < 12; i++) { const w = 34 + (i * 7) % 26, c = C[i % 4], dur = 16 + (i * 5) % 14;
    s += '<svg viewBox="0 0 40 80" width="' + w + '" style="left:' + (4 + i * 8) + '%;animation-duration:' + dur + 's;animation-delay:-' + (i * 3 % dur) + 's;--dx:' + (i % 2 ? 24 : -24) + 'px"><ellipse cx="20" cy="20" rx="16" ry="20" fill="' + c + '"/><path d="M16 42h8l-4-4z" fill="' + c + '"/><path d="M20 42q-6 14 0 36" fill="none" stroke="currentColor" stroke-opacity=".4"/></svg>'; }
  el.style.color = getComputedStyle(document.body).color; el.innerHTML = s;
}
function render() {
  const t = T[lang], c = $('content'); document.body.classList.toggle('am', lang === 'am'); document.documentElement.lang = lang;
  $('bEn').setAttribute('aria-pressed', lang === 'en'); $('bAm').setAttribute('aria-pressed', lang === 'am');
  if (!ev) { c.innerHTML = '<div class="err">' + esc(t.err) + '</div>'; return; }
  const th = qs.get('theme') || ev.theme; document.body.dataset.theme = ['pink', 'blue', 'white'].includes(th) ? th : 'pink';
  sky();
  const C = cols(), p = [], photos = (ev.photo_urls && ev.photo_urls.length) ? ev.photo_urls : (ev.photo_url ? [ev.photo_url] : []);
  p.push(cluster() + '<p class="say">' + esc(t.say) + '</p><h1>' + esc(pick(ev, 'title')) + '</h1>');
  const host = pick(ev, 'host_names'); if (host) p.push('<p class="host">' + esc(t.host) + ' ' + esc(host) + '</p>');
  if (photos[0]) p.push('<div class="bphoto"><div class="pic" role="img" aria-label="" style="background-image:url(\'' + esc(src(photos[0])).replace(/'/g, '%27') + '\')"></div></div>');
  const d = parseDate(ev.event_date);
  if (d) p.push('<div class="when"><p class="big">' + esc(dateText(d)) + '</p>' + (timeText(d) ? '<p class="sm">' + esc(timeText(d)) + '</p>' : '') + '</div>');
  const venue = pick(ev, 'venue');
  if (venue) p.push('<div class="where"><p>' + esc(venue) + '</p>' + (/^https?:\/\//i.test(ev.map_url || '') ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(ev.map_url) + '">' + esc(t.map) + '</a>' : '') + '</div>');
  const days = Array.isArray(ev.days) ? ev.days : [];
  if (days.length > 1 || (days.length === 1 && days[0].title)) p.push('<ul class="prog" aria-label="' + esc(t.prog) + '">' + days.map(x => {
    const tm = x.start ? timeText(parseDate('2000-01-01T' + x.start)) : ''; return '<li><b>' + esc(pick(x, 'title')) + '</b>' + (tm ? '<span>' + esc(tm) + '</span>' : '') + '</li>'; }).join('') + '</ul>');
  const msg = pick(ev, 'message'), wish = pick(ev, 'about').replace(/\s*\[\[tpl:\w+\]\]\s*$/, '').trim(); if (msg) p.push('<p class="msg">' + esc(msg) + '</p>');
  if (wish) p.push('<section class="wish"><h2>' + esc(t.wish) + '</h2><span class="q" aria-hidden="true">\u201C</span><p class="t">' + esc(wish) + '</p>' + (host ? '<p class="by">\u2014 ' + esc(host) + '</p>' : '') + '</section>');
  const gal = [...photos.slice(1), ...(Array.isArray(ev.gallery_urls) ? ev.gallery_urls : [])];
  if (gal.length) p.push('<section class="galwrap"><h2>' + esc(t.gal) + '</h2><div class="gal">' + gal.map((u, n) => '<button type="button" class="ph" data-i="' + n + '" aria-label="' + esc(t.gal) + ' ' + (n + 1) + '"><img alt="" loading="lazy" src="' + esc(src(u)) + '"></button>').join('') + '</div>' + (gal.length > 1 ? '<p class="galhint">' + esc(t.ghint) + '</p>' : '') + '</section>');
  p.push('<section class="gbwrap"><h2>' + esc(t.gb) + '</h2><form class="gbform" id="gbForm"><input name="n" required maxlength="60" autocomplete="name" placeholder="' + esc(t.gbName) + '" aria-label="' + esc(t.gbName) + '"><textarea name="m" required maxlength="500" placeholder="' + esc(t.gbMsg) + '" aria-label="' + esc(t.gbMsg) + '"></textarea><button class="btn" type="submit">' + esc(t.gbSend) + '</button><p class="note" id="gbNote" role="status"></p></form><div class="gblist" id="gbList"></div></section>');
  p.push('<div class="dolls">' + doll(C[1], C[0], 84) + doll(C[2], C[3], 108) + doll(C[0], C[1], 84) + '</div>');
  c.innerHTML = p.join('');
  drawWishes(); $('gbForm').onsubmit = sendWish;
  c.querySelectorAll('.gal .ph').forEach(b => { b.onclick = () => openLb(gal.map(u => src(u)), +b.dataset.i, t); });
}
function drawWishes() {
  const t = T[lang], box = $('gbList'); if (!box) return;
  const dt = x => { const d = x ? new Date(x) : null; return d && !isNaN(d) ? d.toLocaleDateString(lang === 'am' ? 'am-ET' : 'en-GB', { dateStyle:'medium' }) : ''; };
  box.innerHTML = wishes.length ? wishes.map(w => '<div class="gbit"><div class="h"><b>' + esc(pick(w, 'name')) + '</b><small>' + esc(dt(w.created_at)) + '</small></div><p>' + esc(pick(w, 'message')) + '</p></div>').join('') : '<p class="gbempty">' + esc(t.gbEmpty) + '</p>';
}
async function sendWish(e) {
  e.preventDefault();
  const f = e.target, t = T[lang], note = $('gbNote'), btn = f.querySelector('button'), name = f.n.value.trim(), message = f.m.value.trim();
  if (!name || !message) return;
  btn.disabled = true; note.textContent = '';
  try {
    if (SLUG) {
      const r = await fetch(API + '/api/e/' + encodeURIComponent(SLUG) + '/wishes', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ name, message }) });
      if (!r.ok) throw new Error(r.status);
      const w = await r.json().catch(() => ({}));
      wishes.unshift({ name:w.name || name, message:w.message || message, created_at:w.created_at || new Date().toISOString() });
    } else wishes.unshift({ name, message, created_at:new Date().toISOString() });
    f.reset(); drawWishes(); note.textContent = SLUG ? t.gbThanks : t.gbThanks + ' ' + t.gbDemo;
  } catch (x) { note.textContent = t.gbFail; }
  btn.disabled = false;
}
function openLb(list, i, t) {
  const o = document.createElement('div'); o.className = 'lb'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
  const im = document.createElement('img'); im.alt = '';
  const mk = (cls, txt, lab) => { const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = txt; b.setAttribute('aria-label', lab); return b; };
  const x = mk('x', '\u00D7', t.close), pv = mk('pv', '\u2039', t.prev), nx = mk('nx', '\u203A', t.next);
  const show = n => { i = (n + list.length) % list.length; im.src = list[i]; };
  const close = () => { o.remove(); document.removeEventListener('keydown', key); document.documentElement.style.overflow = ''; };
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(i - 1); else if (e.key === 'ArrowRight') show(i + 1); };
  x.onclick = close; pv.onclick = e => { e.stopPropagation(); show(i - 1); }; nx.onclick = e => { e.stopPropagation(); show(i + 1); };
  o.onclick = e => { if (e.target === o) close(); };
  let sx = null; o.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive:true });
  o.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); });
  o.append(im, x); if (list.length > 1) o.append(pv, nx);
  document.addEventListener('keydown', key); document.documentElement.style.overflow = 'hidden'; document.body.append(o); show(i); x.focus();
}
$('bEn').onclick = () => { lang = 'en'; localStorage.setItem('f27_lang', lang); render(); };
$('bAm').onclick = () => { lang = 'am'; localStorage.setItem('f27_lang', lang); render(); };

(async function () {
  const slug = qs.get('e');
  if (!slug) { ev = Object.assign({}, DEMO); if (qs.get('title')) ev.title = qs.get('title'); }
  else { try { const r = await fetch(API + '/api/events/' + encodeURIComponent(slug)); if (!r.ok) throw new Error(r.status); ev = await r.json(); } catch (e) { ev = null; } }
  render();
  if (SLUG && ev) { try { const r = await fetch(API + '/api/e/' + encodeURIComponent(SLUG) + '/wishes'); if (r.ok) { const d = await r.json(); wishes = Array.isArray(d) ? d : (Array.isArray(d.wishes) ? d.wishes : []); drawWishes(); } } catch (x) {} }
})();
</script>
