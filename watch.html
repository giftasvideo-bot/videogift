<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever 27 | Your Gift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d0d0d;
      --paper: #faf7f2;
      --gold: #c9933a;
      --cream: #f0ead8;
      --muted: #7a7060;
      --error: #b23b3b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border: 1px solid rgba(201, 147, 58, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(13, 13, 13, 0.02);
      text-align: center;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 32px;
    }

    /* Video Player Wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 9 / 16; /* Optimized for vertical smartphone videos */
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
      margin-bottom: 24px;
      display: none; /* Shown dynamically when loaded */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-box {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--ink);
      margin-top: 16px;
      padding: 0 8px;
      display: none;
    }

    /* Dynamic State Screens */
    .state-screen {
      padding: 40px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--cream);
      border-top-color: var(--gold);
      border-radius: 50%;
      margin: 0 auto 16px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-text {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .error-text {
      color: var(--error);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand-title">Forever 27</div>
    <div class="brand-sub">A Digital Keepsake</div>

    <div id="loading-state" class="state-screen">
      <div class="spinner"></div>
      <p class="state-text">Unwrapping your video memory...</p>
    </div>

    <div id="player-state" style="display: none;">
      <div class="video-wrapper">
        <video id="gift-video" controls playsinline controlsList="nodownload"></video>
      </div>
      <div id="gift-message" class="message-box"></div>
    </div>

    <div id="error-state" class="state-screen" style="display: none;">
      <p id="error-message" class="error-text">Something went wrong.</p>
    </div>
  </div>

  <footer>&copy; 2026 Forever 27</footer>

  <script>
    // Hardcoded permanent API connection link
    const API_BASE = 'https://videogift-backend-3.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
      fetchGiftDetails();
    });

    async function fetchGiftDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const giftId = urlParams.get('id');

      if (!giftId) {
        showError("No unique Gift ID detected. Please scan your physical QR card code again.");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/gift/${encodeURIComponent(giftId)}`);
        
        // ── SMART REDIRECT LOGIC ──
        // If the database returns a 404 (Not Found), it means this is a fresh empty gift token card!
        if (response.status === 404) {
          window.location.href = `upload.html?id=${encodeURIComponent(giftId)}`;
          return;
        }

        if (!response.ok) throw new Error("Server communication fault");

        const data = await response.json();

        // If the row exists but there is no video tracking URL saved yet, redirect to upload
        if (!data || !data.videoUrl) {
          window.location.href = `upload.html?id=${encodeURIComponent(giftId)}`;
          return;
        }

        // Target found and loaded successfully! Fire up the visual playback interface
        renderWatchUI(data);
        
        // Quietly signal back to the server to change database status row to "viewed"
        markAsViewed(giftId);

      } catch (error) {
        console.error("Fetch Exception:", error);
        showError("Unable to establish a link to the media server. Please check your network connection.");
      }
    }

    function renderWatchUI(giftData) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('player-state').style.display = 'block';

      // Load Video Source Link
      const videoElement = document.getElementById('gift-video');
      videoElement.src = giftData.videoUrl;

      // Load Text Note if left by sender
      if (giftData.message && giftData.message.trim() !== "") {
        const msgBox = document.getElementById('gift-message');
        msgBox.textContent = `"${giftData.message}"`;
        msgBox.style.display = 'block';
      }
    }

    function showError(messageString) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('player-state').style.display = 'none';
      
      const errorStateBox = document.getElementById('error-state');
      const errorMsgLabel = document.getElementById('error-message');
      
      errorMsgLabel.textContent = messageString;
      errorStateBox.style.display = 'block';
    }

    async function markAsViewed(id) {
      try {
        await fetch(`${API_BASE}/api/gift/${encodeURIComponent(id)}/view`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
      } catch (e) {
        console.warn("View acknowledgement could not register structural status change.");
      }
    }
  </script>
</body>
</html>
