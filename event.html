<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're invited</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500&family=Noto+Sans+Ethiopic:wght@400;600&family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef4f3; --ink:#123c40; --accent:#0f5257; --soft:#d9e8e6; }
  [data-type=wedding]  { --bg:#f3ecdc; --ink:#4a3a24; --accent:#7a5c3a; --soft:#e7dcc4; }
  [data-type=birthday] { --bg:#fff3c4; --ink:#16308f; --accent:#1f3fbf; --soft:#ffe58a; }
  [data-type=church]   { --bg:#eceee9; --ink:#1e3a2f; --accent:#2f6b52; --soft:#d8dcd3; }
  [data-type=seminar]  { --bg:#eef1f7; --ink:#1b2a4a; --accent:#2c4a8f; --soft:#d8e0f0; }
  [data-type=memorial] { --bg:#efefef; --ink:#2a2a2a; --accent:#555;    --soft:#dcdcdc; }
  body[data-theme=white]    { --bg:#ffffff; --ink:#2b2b2b; --accent:#8a6d3b; --soft:#f0ece4; }
  body[data-theme=black]    { --bg:#1c1c1c; --ink:#f2ece0; --accent:#c9a96a; --soft:#2d2d2d; --on:#1c1c1c; }
  body[data-theme=grey]     { --bg:#e9e9e9; --ink:#2f2f2f; --accent:#6b5b45; --soft:#d8d8d8; }
  body[data-theme=cream]    { --bg:#f3ecdc; --ink:#4a3a24; --accent:#7a5c3a; --soft:#e7dcc4; }
  body[data-theme=navy]     { --bg:#22384f; --ink:#f4efe3; --accent:#d8b978; --soft:#2f4862; --on:#22384f; }
  body[data-theme=burgundy] { --bg:#6b2233; --ink:#f7ece6; --accent:#e0bf8a; --soft:#7d3245; --on:#4a1421; }
  .btn.fill { color:var(--on,#fff); }
  .wed input { color:#222; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 1rem/1.6 'DM Sans','Noto Sans Ethiopic',sans-serif; }
  main { max-width:560px; margin:0 auto; padding:0 0 48px; }
  .photo { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--soft); }
  .slides { position:relative; width:100%; aspect-ratio:4/5; background:var(--soft); overflow:hidden; }
  .slide { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .9s; }
  .slide.on { opacity:1; }
  .dots { position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:6px; }
  .dot { width:26px; height:26px; padding:0; border:0; background:transparent; cursor:pointer; position:relative; }
  .dot::after { content:''; position:absolute; inset:8px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 3px rgba(0,0,0,.5); }
  .dot.on::after { background:#fff; }
  .dot:focus-visible { outline:3px solid #fff; border-radius:50%; }
  @media (prefers-reduced-motion: reduce) { .slide { transition:none; } }
  .body { padding:28px 22px 0; }
  h1 { font:700 clamp(2rem,9vw,2.9rem)/1.1 'Fraunces','Noto Sans Ethiopic',serif; margin:0 0 6px; }
  .hosts { font-size:1.1rem; margin:0 0 20px; }
  .when { font-weight:500; margin:0; }
  .where { margin:0 0 18px; }
  .msg { font:500 1.15rem/1.6 'Fraunces','Noto Sans Ethiopic',serif; white-space:pre-wrap; margin:22px 0; }
  video { width:100%; border-radius:6px; background:#000; margin:6px 0 18px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
  .btn { border:2px solid var(--accent); background:transparent; color:var(--accent); padding:11px 18px; border-radius:6px; font:500 .95rem 'DM Sans',sans-serif; cursor:pointer; text-decoration:none; }
  .btn.fill { background:var(--accent); color:#fff; }
  .btn:focus-visible, input:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  form { background:var(--soft); padding:20px; border-radius:8px; display:grid; gap:12px; }
  form h2 { font:700 1.3rem 'Fraunces',serif; margin:0; }
  input { padding:11px; border:1px solid var(--accent); border-radius:6px; font:inherit; background:#fff; width:100%; }
  .choice { display:flex; gap:10px; } .choice .btn { flex:1; }
  .choice .on { background:var(--accent); color:#fff; }
  .note { min-height:1.4em; font-weight:500; }

  .wed main { max-width:720px; }
  .wed-head { text-align:center; padding:44px 22px 30px; }
  .wed-of { display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,22px); font:500 clamp(.8rem,2.6vw,1rem)/1 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.4em; text-transform:uppercase; }
  .wed-script { font:400 clamp(3.4rem,17vw,6rem)/1 'Pinyon Script','Noto Sans Ethiopic',cursive; letter-spacing:0; text-transform:none; color:var(--ink); }
  .wed-names { font:500 clamp(1.5rem,7vw,2.6rem)/1.2 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.18em; text-transform:uppercase; margin:18px 0 0; }
  .wed-host { font:500 1rem 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.14em; margin:8px 0 0; }
  .wed-line { font:500 .8rem/1.9 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.22em; text-transform:uppercase; margin:18px 0 0; color:var(--accent); }
  .wed .photo, .wed .slides { aspect-ratio:3/2; }
  .wed .agenda li { background:transparent; border-left:0; border-top:1px solid var(--accent); border-radius:0; text-align:center; }
  .wed .agenda .dt { font-family:'Cormorant Garamond','Noto Sans Ethiopic',serif; }
  .wed .body { text-align:center; }
  .wed .row { justify-content:center; }
  .wed .msg { font-family:'Cormorant Garamond','Noto Sans Ethiopic',serif; font-size:1.3rem; }
  .wed form { text-align:left; }

  .wnav { display:flex; justify-content:center; flex-wrap:wrap; gap:4px 22px; padding:16px 12px 6px; position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--soft); }
  .wtab { border:0; background:transparent; color:var(--ink); font:600 .95rem 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.14em; text-transform:uppercase; padding:8px 2px; cursor:pointer; border-bottom:2px solid transparent; }
  .wtab[aria-selected=true] { border-bottom-color:var(--accent); color:var(--accent); }
  .wtab:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  .wpanel { padding:28px 22px 0; text-align:center; }
  .wpanel h2 { font:400 clamp(2rem,9vw,2.8rem)/1.1 'Pinyon Script','Noto Sans Ethiopic',cursive; margin:0 0 18px; }
  .sgroup { margin:0 0 26px; }
  .sgroup h3 { font:600 .9rem 'Cormorant Garamond','Noto Sans Ethiopic',serif; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  .times { list-style:none; margin:0; padding:0; }
  .times li { display:grid; grid-template-columns:minmax(6rem,38%) 1fr; gap:14px; align-items:baseline; padding:12px 0; border-top:1px solid var(--soft); text-align:left; }
  .times .tm { font:600 1.1rem 'Cormorant Garamond',serif; color:var(--accent); text-align:right; }
  .times .tt { font:500 1.25rem/1.3 'Cormorant Garamond','Noto Sans Ethiopic',serif; }
  .wgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .wgrid img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--soft); }
  .wgrid img:first-child:nth-last-child(odd) { grid-column:span 2; aspect-ratio:3/2; }
  .wpanel form { text-align:left; }
  .err { padding:80px 22px; text-align:center; }
  .agenda { list-style:none; margin:0 0 18px; padding:0; display:grid; gap:10px; }
  .agenda li { background:var(--soft); border-left:4px solid var(--accent); border-radius:6px; padding:10px 14px; }
  .agenda .dd { font-weight:500; font-size:.9rem; }
  .agenda .dt { font:700 1.1rem/1.3 'Fraunces','Noto Sans Ethiopic',serif; }
</style>
</head>
<body>
<main id="app"><p class="err">Loading invitation…</p></main>
<script>
const API = 'https://videogift-backend-3.onrender.com';
const qs = new URLSearchParams(location.search);
let slug = qs.get('e');
const card = qs.get('g');
const app = document.getElementById('app');
const el = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt) n.textContent = txt; return n; };

const dayDate = d => { const [y, m, dd] = d.date.split('-').map(Number); const [h, mi] = (d.time || '').split(':').map(Number); return d.time ? new Date(y, m - 1, dd, h, mi) : new Date(y, m - 1, dd); };
function icsDays(ev, days) {
  const p = n => String(n).padStart(2, '0');
  const loc = x => '' + x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate()) + 'T' + p(x.getHours()) + p(x.getMinutes()) + '00';
  const day = x => '' + x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate());
  const clean = s => (s || '').replace(/[\r\n,;]/g, ' ');
  const out = ['BEGIN:VCALENDAR','VERSION:2.0'];
  days.forEach((d, i) => {
    const s = dayDate(d); let e = new Date(s.getTime() + (d.time ? 3 * 3600e3 : 24 * 3600e3));
    if (d.time && d.end) { e = dayDate({ date:d.date, time:d.end }); if (e <= s) e = new Date(e.getTime() + 24 * 3600e3); }
    out.push('BEGIN:VEVENT', 'UID:' + slug + '-' + i + '@invite', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]|\.\d{3}/g, ''),
      'SUMMARY:' + clean(ev.title + ': ' + d.title), 'LOCATION:' + clean(ev.venue),
      d.time ? 'DTSTART:' + loc(s) : 'DTSTART;VALUE=DATE:' + day(s), d.time ? 'DTEND:' + loc(e) : 'DTEND;VALUE=DATE:' + day(e), 'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}
function ics(ev) {
  const days = Array.isArray(ev.days) ? ev.days.filter(d => d && d.date) : [];
  if (days.length) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([icsDays(ev, days)], { type:'text/calendar' }));
    a.download = 'invitation.ics'; a.click(); return;
  }
  const d = new Date(ev.event_date), f = x => x.toISOString().replace(/[-:]|\.\d{3}/g, '');
  const end = new Date(d.getTime() + 3 * 3600e3);
  const clean = s => (s || '').replace(/[\r\n,;]/g, ' ');
  const text = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','DTSTART:'+f(d),'DTEND:'+f(end),
    'SUMMARY:'+clean(ev.title),'LOCATION:'+clean(ev.venue),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/calendar' }));
  a.download = 'invitation.ics'; a.click();
}

function slideshow(urls) {
  if (urls.length === 1) { const i = el('img','photo'); i.src = urls[0]; i.alt = ''; return i; }
  const box = el('div','slides'); box.setAttribute('role','group'); box.setAttribute('aria-label','Photo slideshow');
  const imgs = urls.map((u, k) => { const i = el('img','slide'); i.src = u; i.alt = ''; if (!k) i.classList.add('on'); box.append(i); return i; });
  const dots = el('div','dots');
  const btns = urls.map((_, k) => { const b = el('button','dot'); b.type = 'button'; b.setAttribute('aria-label','Photo ' + (k + 1));
    b.onclick = () => { go(k); restart(); }; dots.append(b); return b; });
  let cur = 0, timer;
  function go(k) { imgs[cur].classList.remove('on'); btns[cur].classList.remove('on'); cur = k; imgs[cur].classList.add('on'); btns[cur].classList.add('on'); }
  function restart() { clearInterval(timer); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) timer = setInterval(() => go((cur + 1) % imgs.length), 4500); }
  btns[0].classList.add('on'); box.append(dots); restart();
  return box;
}

function renderWedding(ev) {
  document.body.classList.add('wed');
  if (['white','black','grey','cream','navy','burgundy'].includes(ev.theme)) document.body.dataset.theme = ev.theme;
  const photos = (ev.photo_urls && ev.photo_urls.length) ? ev.photo_urls : (ev.photo_url ? [ev.photo_url] : []);
  const days = Array.isArray(ev.days) ? ev.days.filter(d => d && d.date) : [];
  const first = days.length ? dayDate(days[0]) : (ev.event_date ? new Date(ev.event_date) : null);
  const h = el('header','wed-head'), of = el('div','wed-of');
  of.append(el('span','','The'), el('span','wed-script','Wedding'), el('span','','of'));
  h.append(of, el('h1','wed-names',ev.title));
  if (ev.host_names) h.append(el('p','wed-host', ev.host_names));
  const bits = [first && first.toLocaleDateString([], { dateStyle:'long' }), ev.venue].filter(Boolean);
  if (bits.length) h.append(el('p','wed-line', bits.join('  \u2022  ')));
  app.append(h);

  const secs = [];
  if (days.length || ev.event_date) secs.push(['Schedule', p => {
    if (days.length) {
      const groups = new Map();
      days.forEach(d => { (groups.get(d.date) || groups.set(d.date, []).get(d.date)).push(d); });
      groups.forEach(items => {
        const g = el('div','sgroup');
        g.append(el('h3','',dayDate(items[0]).toLocaleDateString([], { dateStyle:'full' })));
        const ul = el('ul','times');
        items.forEach(d => { const li = el('li');
          li.append(el('span','tm', d.time ? dayDate(d).toLocaleTimeString([], { timeStyle:'short' }) + (d.end ? ' \u2013 ' + dayDate({ date:d.date, time:d.end }).toLocaleTimeString([], { timeStyle:'short' }) : '') : ''), el('span','tt', d.title || ''));
          ul.append(li); });
        g.append(ul); p.append(g);
      });
    } else p.append(el('p','when', new Date(ev.event_date).toLocaleString([], { dateStyle:'full', timeStyle:'short' })));
    const r = el('div','row'), c = el('button','btn','Add to calendar'); c.onclick = () => ics(ev); r.append(c); p.append(r);
  }]);
  if (ev.venue || ev.map_url) secs.push(['Venue', p => {
    if (ev.venue) p.append(el('p','where', ev.venue));
    if (ev.map_url) { const r = el('div','row'), m = el('a','btn','Open map'); m.href = ev.map_url; m.target = '_blank'; m.rel = 'noopener'; r.append(m); p.append(r); }
  }]);
  if (ev.about || ev.message) secs.push(['About us', p => { if (ev.about) p.append(el('p','msg', ev.about)); if (ev.message) p.append(el('p','msg', ev.message)); }]);
  const more = Array.isArray(ev.gallery_urls) ? ev.gallery_urls : [], allPhotos = photos.concat(more);
  if (allPhotos.length > 1) secs.push(['Photos', p => { const g = el('div','wgrid'); allPhotos.forEach(u => { const i = el('img'); i.src = u; i.alt = ''; i.loading = 'lazy'; g.append(i); }); p.append(g); }]);
  if (ev.video_url) secs.push(['Video', p => { const v = el('video'); v.src = ev.video_url; v.controls = true; v.preload = 'metadata'; v.playsInline = true; p.append(v); }]);
  if (ev.rsvp_enabled) secs.push(['RSVP', p => p.append(rsvpForm())]);
  if (!secs.length) { if (photos.length) app.append(slideshow(photos)); return; }

  const nav = el('nav','wnav'); nav.setAttribute('role','tablist'); nav.setAttribute('aria-label','Invitation sections');
  const holder = el('div');
  const tabs = [], panels = [];
  const show = k => tabs.forEach((t, j) => { t.setAttribute('aria-selected', j === k); panels[j].hidden = j !== k; });
  secs.forEach(([name, fill], k) => {
    const t = el('button','wtab',name); t.type = 'button'; t.setAttribute('role','tab'); t.onclick = () => show(k);
    const p = el('section','wpanel'); p.setAttribute('role','tabpanel'); p.append(el('h2','',name)); fill(p);
    tabs.push(t); panels.push(p); nav.append(t); holder.append(p);
  });
  app.append(nav);
  if (photos.length) app.append(slideshow(photos));
  app.append(holder); show(0);
}

function render(ev) {
  document.title = ev.title;
  document.body.dataset.type = ev.type;
  if (ev.type === 'wedding') { app.textContent = ''; return renderWedding(ev); }
  app.textContent = '';
  const photos = (ev.photo_urls && ev.photo_urls.length) ? ev.photo_urls : (ev.photo_url ? [ev.photo_url] : []);
  const wed = ev.type === 'wedding';
  document.body.classList.toggle('wed', wed);
  const days0 = Array.isArray(ev.days) ? ev.days.filter(d => d && d.date) : [];
  if (wed) {
    const h = el('header','wed-head'), of = el('div','wed-of');
    of.append(el('span','','The'), el('span','wed-script','Wedding'), el('span','','of'));
    h.append(of, el('h1','wed-names',ev.title));
    if (ev.host_names) h.append(el('p','wed-host', ev.host_names));
    const first = days0.length ? dayDate(days0[0]) : (ev.event_date ? new Date(ev.event_date) : null);
    const bits = [first && first.toLocaleDateString([], { dateStyle:'long' }), ev.venue].filter(Boolean);
    if (bits.length) h.append(el('p','wed-line', bits.join('  •  ')));
    app.append(h);
  }
  if (photos.length) app.append(slideshow(photos));
  const b = el('div','body');
  if (!wed) {
    b.append(el('h1', '', ev.title));
    if (ev.host_names) b.append(el('p','hosts', ev.host_names));
  }
  const days = Array.isArray(ev.days) ? ev.days.filter(d => d && d.date) : [];
  if (days.length) {
    const ul = el('ul','agenda');
    days.forEach(d => {
      const li = el('li');
      const when = dayDate(d).toLocaleString([], d.time ? { dateStyle:'full', timeStyle:'short' } : { dateStyle:'full' });
      li.append(el('div','dd', when), el('div','dt', d.title || ''));
      ul.append(li);
    });
    b.append(ul);
  } else if (ev.event_date && !wed) b.append(el('p','when', new Date(ev.event_date).toLocaleString([], { dateStyle:'full', timeStyle:'short' })));
  if (ev.venue && !wed) b.append(el('p','where', ev.venue));
  const row = el('div','row');
  if (ev.event_date || days.length) { const c = el('button','btn','Add to calendar'); c.onclick = () => ics(ev); row.append(c); }
  if (ev.map_url) { const m = el('a','btn','Open map'); m.href = ev.map_url; m.target = '_blank'; m.rel = 'noopener'; row.append(m); }
  if (row.children.length) b.append(row);
  if (ev.message) b.append(el('p','msg', ev.message));
  if (ev.video_url) { const v = el('video'); v.src = ev.video_url; v.controls = true; v.preload = 'metadata'; v.playsInline = true; b.append(v); }
  if (ev.rsvp_enabled) b.append(rsvpForm());
  app.append(b);
}

function rsvpForm() {
  let attending = true;
  const f = el('form'); f.append(el('h2','','Will you come?'));
  const name = el('input'); name.placeholder = 'Your name'; name.required = true; name.maxLength = 100;
  const n = el('input'); n.type = 'number'; n.min = 1; n.max = 20; n.value = 1; n.setAttribute('aria-label','Number of guests');
  const ch = el('div','choice'), yes = el('button','btn on','Yes, I\'ll be there'), no = el('button','btn','Can\'t make it');
  yes.type = no.type = 'button';
  yes.onclick = () => { attending = true; yes.classList.add('on'); no.classList.remove('on'); };
  no.onclick = () => { attending = false; no.classList.add('on'); yes.classList.remove('on'); };
  ch.append(yes, no);
  const send = el('button','btn fill','Send reply'), note = el('p','note');
  f.append(name, ch, n, send, note);
  f.onsubmit = async e => {
    e.preventDefault(); send.disabled = true;
    try {
      const r = await fetch(`${API}/api/e/${encodeURIComponent(slug)}/rsvp`, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name:name.value, attending, guests:n.value }) });
      if (!r.ok) throw new Error((await r.json()).error);
      note.textContent = 'Reply sent. Thank you!'; f.querySelectorAll('input,button').forEach(x => x.disabled = true);
    } catch (x) { note.textContent = 'Could not send: ' + x.message; send.disabled = false; }
  };
  return f;
}

function renderReady(code) {
  document.title = 'Create your invitation';
  app.textContent = '';
  const b = el('div','body'); b.style.paddingTop = '64px'; b.style.textAlign = 'center';
  b.append(el('h1','','Your invitation card is ready'),
    el('p','','Add your photos, video and event details. After that, the QR code on this card will open your invitation for everyone who scans it.'));
  const a = el('a','btn fill','Create my invitation'); a.href = 'create-event.html?code=' + encodeURIComponent(code); a.style.display = 'inline-block';
  b.append(a); app.append(b);
}

(async () => {
  if (!slug && card) {
    try {
      const d = await (await fetch(`${API}/api/event-code/${encodeURIComponent(card)}/status`)).json();
      if (d.state === 'created') slug = d.slug;
      else if (d.state === 'ready') return renderReady(card);
      else return location.replace('watch.html?id=' + encodeURIComponent(card));
    } catch { return app.replaceChildren(el('p','err','Could not check this card. Please try again.')); }
  }
  if (!slug) return app.replaceChildren(el('p','err','This link is missing its invitation code.'));
  try {
    const r = await fetch(`${API}/api/e/${encodeURIComponent(slug)}`);
    if (!r.ok) throw 0;
    render(await r.json());
  } catch { app.replaceChildren(el('p','err','This invitation could not be found. Check the link and try again.')); }
})();
</script>
</body>
</html>
