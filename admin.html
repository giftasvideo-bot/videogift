<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever 27 | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --ink: #0d0d0d; --paper: #faf7f2; --gold: #c9933a; --gold-light: #e8b86d; --cream: #f0ead8; --muted: #7a7060; --success-bg: #e8f5e9; --success-text: #2e7d32; --pending-bg: #fff3e0; --pending-text: #ef6c00; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; padding: 40px 20px; min-height: 100vh; }
    .dashboard { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 40px; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2rem; }
    .logo span { color: var(--gold); font-style: italic; }
    .card-section { background: #ffffff; border: 1px solid var(--cream); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
    .btn { padding: 12px 24px; background: var(--gold); color: #ffffff; border: none; border-radius: 6px; cursor: pointer; }
    .btn-secondary { background: var(--cream); color: var(--ink); }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; margin-top: 20px; }
    .qr-card { background: #ffffff; border: 1px solid var(--cream); border-radius: 12px; padding: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .qr-container { width: 160px; height: 160px; background: var(--paper); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; border-radius: 8px; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
    .status-pending { background: var(--pending-bg); color: var(--pending-text); }
    .status-uploaded { background: var(--success-bg); color: var(--success-text); }
    .card-actions { display: flex; gap: 8px; width: 100%; margin-top: auto; }
    .btn-action-delete { background: #ffebee; color: #c62828; }
    .btn-action-delete-video { background: #fff3e0; color: #e65100; }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <div class="logo">Forever<span>27</span></div>
    <h1>System Operations Control</h1>
  </div>

  <div class="card-section">
    <h2>📋 Active Card Registry Collection</h2>
    <div class="qr-grid" id="cards-grid-container"></div>
  </div>
</div>

<script>
  let BACKEND_API_BASE = localStorage.getItem('videogift_api_url') || 'https://videogift-backend-3.onrender.com';
  let localRegistry = [];

  async function apiFetch(url, options = {}) {
    const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json' } });
    return res;
  }

  // FORCE FETCH FROM DATABASE to fix Chrome rendering issues
  async function syncRegistryFromDatabase() {
    try {
      const response = await apiFetch(`${BACKEND_API_BASE}/api/admin/list-all`);
      if (response.ok) {
        const data = await response.json();
        localRegistry = data.ids; // Assuming server returns { ids: [...] }
        renderDashboardGrid();
        syncStatusesWithDatabase();
      }
    } catch (err) {
      console.error("Sync failed, check backend connectivity:", err);
    }
  }

  async function syncStatusesWithDatabase() {
    if (localRegistry.length === 0) return;
    try {
      const response = await apiFetch(`${BACKEND_API_BASE}/api/gifts/status`, { method: 'POST', body: JSON.stringify({ ids: localRegistry }) });
      const data = await response.json();
      localRegistry.forEach(id => {
        const badge = document.getElementById(`badge-${id}`);
        if (badge) {
          badge.textContent = (data.statuses[id] || 'pending').toUpperCase();
          badge.className = `status-badge status-${data.statuses[id] || 'pending'}`;
        }
      });
    } catch (err) { console.warn('Status sync failed'); }
  }

  function renderDashboardGrid() {
    const gridContainer = document.getElementById('cards-grid-container');
    gridContainer.innerHTML = '';
    localRegistry.forEach(id => {
      const card = document.createElement('div');
      card.className = 'qr-card';
      card.id = `card-${id}`;
      card.innerHTML = `
        <div class="qr-container" id="qr-container-${id}"></div>
        <div class="qr-id-label">${id}</div>
        <div class="status-badge" id="badge-${id}">LOADING...</div>
        <div class="card-actions">
          <button class="btn btn-action-delete-video" onclick="deleteVideoOnly('${id}')">🎬 Delete Video</button>
          <button class="btn btn-action-delete" onclick="deleteCardRow('${id}')">🗑️ Delete</button>
        </div>
      `;
      gridContainer.appendChild(card);
      new QRCode(document.getElementById(`qr-container-${id}`), { text: window.location.origin + '/watch.html?id=' + id, width: 140, height: 140 });
    });
  }

  async function deleteVideoOnly(id) {
    if (!confirm('Clear the video for this card?')) return;
    await apiFetch(`${BACKEND_API_BASE}/api/gift/${id}/video`, { method: 'DELETE' });
    syncStatusesWithDatabase();
  }

  async function deleteCardRow(id) {
    if (!confirm('Permanently delete card?')) return;
    await apiFetch(`${BACKEND_API_BASE}/api/gift/${id}`, { method: 'DELETE' });
    syncRegistryFromDatabase();
  }

  // Initialize
  syncRegistryFromDatabase();
  setInterval(syncStatusesWithDatabase, 5000);
</script>
</body>
</html>
