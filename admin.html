<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forever 27 | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

  <style>
    :root { --ink: #0d0d0d; --paper: #faf7f2; --gold: #c9933a; }
    body { background-color: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; padding: 40px; }
    .dashboard { max-width: 1000px; margin: 0 auto; }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .qr-card { background: white; padding: 20px; border: 1px solid #e5dec9; border-radius: 10px; text-align: center; }
    .qr-container { width: 140px; height: 140px; margin: 0 auto 10px; }
  </style>
</head>
<body>

<div class="dashboard">
  <h1>System Registry</h1>
  <div class="qr-grid" id="cards-grid-container"></div>
</div>

<script>
  // Wait for the library to be loaded
  window.addEventListener('load', () => {
    if (typeof QRCode === "undefined") {
      alert("Error: QR Code library failed to load. Check your internet connection.");
      console.error("QRCode library not found.");
      return;
    }

    let localRegistry = JSON.parse(localStorage.getItem('forever27_cards_manifest')) || [];
    const gridContainer = document.getElementById('cards-grid-container');

    localRegistry.forEach(id => {
      const card = document.createElement('div');
      card.className = 'qr-card';
      
      const qrWrapper = document.createElement('div');
      qrWrapper.className = 'qr-container';
      qrWrapper.id = `qr-${id}`;
      
      card.appendChild(qrWrapper);
      card.innerHTML += `<div>${id}</div>`;
      gridContainer.appendChild(card);

      // Initialize after DOM is fully painted
      try {
        new QRCode(document.getElementById(`qr-${id}`), {
          text: `${window.location.origin}/watch.html?id=${id}`,
          width: 140,
          height: 140
        });
      } catch (err) {
        console.error("Render failed for " + id, err);
      }
    });
  });
</script>
</body>
</html>
