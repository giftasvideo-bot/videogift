<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Dancing+Script:wght@600&family=Noto+Serif+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#4a2f1a; --maroon:#7a2e1f; --gold:#9a6b1f; --muted:#7a5a3a; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 30%, #5a3524 0%, #34200f 55%, #1f120a 100%);
    font-family:'Playfair Display', Georgia, 'Noto Serif Ethiopic', serif; color:var(--ink);
  }
  body.am { font-family:'Noto Serif Ethiopic', 'Playfair Display', serif; }

  /* language switch */
  .lang { position:fixed; top:max(12px, env(safe-area-inset-top)); right:12px; z-index:20; display:flex; background:rgba(255,246,225,.14); border:1px solid rgba(255,230,170,.35); border-radius:999px; padding:3px; backdrop-filter:blur(6px); }
  .lang button { font:inherit; font-size:.82rem; border:0; background:none; color:#f6e7c1; padding:6px 12px; border-radius:999px; cursor:pointer; }
  .lang button[aria-pressed=true] { background:#f6e7c1; color:#4a2f1a; font-weight:700; }

  /* the scroll: top roll + stretchable parchment + bottom roll, all cut from the supplied picture */
  .stage { --w:min(92vw, 400px); width:var(--w); position:relative; }
  .scroll { position:relative; width:100%; filter:drop-shadow(0 18px 16px rgba(0,0,0,.45)); transform-origin:50% 60%; }
  .stage:not(.open) .scroll { cursor:pointer; animation:sway 4.2s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:rotate(-1.2deg); } 50% { transform:rotate(1.2deg); } }
  .scroll img { display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .cap-top { position:relative; z-index:2; }
  .cap-bot { position:relative; z-index:3; margin-top:calc(var(--w) * -0.128); transition:margin-top 1.5s cubic-bezier(.45,.05,.2,1); }

    transition:height 1.5s cubic-bezier(.45,.05,.2,1);
  }
  .stage.open .paper { height:var(--h, 520px); }
  .stage.open .cap-bot { margin-top:-1px; }

  /* tie ribbon + seal while closed */
  .ribbon { position:absolute; z-index:5; left:50%; top:0; bottom:0; width:13%; transform:translateX(-50%); pointer-events:none; transition:opacity .45s ease, transform .6s ease; }
  .ribbon::before { content:""; position:absolute; inset:0 0; background:linear-gradient(90deg,#5d1d14,#9b3a27 35%,#b4513a 50%,#8a2f20 70%,#5a1c13); border-radius:2px; box-shadow:0 0 0 1px rgba(40,10,5,.35); }
  .seal { position:absolute; left:50%; top:50%; width:150%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e7c068, #b9852b 55%, #7d5513); box-shadow:0 2px 4px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,235,170,.55);
    display:grid; place-items:center; color:#5a3a0c; font-family:'Dancing Script', cursive; font-weight:600; font-size:clamp(.95rem, 4.6vw, 1.35rem); }
  .stage.open .ribbon { opacity:0; transform:translateX(-50%) scaleY(.6); }

  .hint { margin-top:22px; color:#f1dfb6; font-size:.95rem; letter-spacing:.04em; text-align:center; animation:pulse 2.2s ease-in-out infinite; transition:opacity .4s; }
  .stage.open ~ .hint { opacity:0; pointer-events:none; animation:none; }
  @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }

  /* the invitation text, written on the parchment */
  .content { position:absolute; left:0; right:0; top:0; padding:calc(var(--w) * .085) 15% calc(var(--w) * .06); text-align:center; }
  .content > * { opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s; }
  .stage.open .content > * { opacity:1; transform:none; transition:opacity .8s ease, transform .8s ease; transition-delay:calc(.75s + var(--i, 0) * .12s); }
  .kicker { font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin:0 0 8px; }
  body.am .kicker { letter-spacing:.04em; text-transform:none; font-size:.85rem; }
  h1 { font-weight:700; font-size:clamp(1.45rem, 7vw, 1.9rem); line-height:1.2; margin:0 0 6px; color:var(--maroon); }
  .orn { display:flex; align-items:center; gap:10px; color:var(--gold); margin:12px 0; font-size:.8rem; }
  .orn::before, .orn::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .orn::after { transform:scaleX(-1); }
  .label { font-size:.66rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); margin:0 0 3px; }
  body.am .label { letter-spacing:.03em; text-transform:none; font-size:.8rem; }
  .val { font-size:1.02rem; line-height:1.4; margin:0 0 12px; font-weight:500; }
  .big { font-size:1.15rem; font-weight:700; }
  .msg { font-family:'Dancing Script', 'Noto Serif Ethiopic', cursive; font-size:1.32rem; line-height:1.35; margin:6px 0 12px; color:var(--ink); }
  body.am .msg { font-family:'Noto Serif Ethiopic', serif; font-size:1rem; line-height:1.6; }
  .prog { list-style:none; padding:0; margin:0 0 12px; font-size:.92rem; }
  .prog li { padding:3px 0; }
  .prog b { color:var(--maroon); font-weight:700; }
  .btn { display:inline-block; margin:2px 0 10px; padding:8px 16px; border-radius:999px; border:1px solid var(--maroon); color:var(--maroon); text-decoration:none; font-size:.85rem; font-weight:700; background:rgba(255,248,230,.5); }
  .roll-up { font:inherit; font-size:.78rem; color:var(--muted); background:none; border:0; text-decoration:underline; cursor:pointer; padding:4px; }
  .err { color:var(--maroon); padding:20px 0; }
  @media (prefers-reduced-motion: reduce) { .stage:not(.open) .scroll { animation:none; } .paper, .cap-bot { transition-duration:.01s; } .stage.open .content > * { transition-delay:0s; } }
</style>

  const p = parseDate(ev.event_date);
  if (p) parts.push('<div><p class="label">' + esc(t.when) + '</p><p class="val big">' + esc(dateText(p)) + (timeText(p) ? '<br>' + esc(timeText(p)) : '') + '</p></div>');
  const venue = pick(ev, 'venue');
  if (venue) parts.push('<div><p class="label">' + esc(t.where) + '</p><p class="val">' + esc(venue) + '</p>' + (/^https?:\/\//i.test(ev.map_url || '') ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(ev.map_url) + '">' + esc(t.map) + '</a>' : '') + '</div>');
  const days = Array.isArray(ev.days) ? ev.days : [];
  if (days.length > 1 || (days.length === 1 && days[0].title)) {
    parts.push('<div class="orn">\u2726</div><p class="label">' + esc(t.prog) + '</p><ul class="prog">' + days.map(d => {
      const dp = parseDate(d.date); const same = dp && p && dp.y === p.y && dp.m === p.m && dp.d === p.d; const when = (dp && !same) ? dateText(dp).replace(/^[^,\u1363]+[,\u1363] /, '') : ''; const tm = d.start ? timeText(parseDate('2000-01-01T' + d.start)) : '';
      return '<li><b>' + esc(pick(d, 'title')) + '</b>' + ((when || tm) ? '<br>' + esc([when, tm].filter(Boolean).join(' \u00B7 ')) : '') + '</li>';
    }).join('') + '</ul>');
  }
  const msg = pick(ev, 'message'); if (msg) parts.push('<div class="orn">\u2726</div><p class="msg">' + esc(msg) + '</p>');
  parts.push('<button class="roll-up" id="rollUp" type="button">' + esc(t.up) + '</button>');
  c.innerHTML = parts.join('');
  [...c.children].forEach((el, i) => el.style.setProperty('--i', i));
  $('rollUp').onclick = e => { e.stopPropagation(); setOpen(false); };
  fit();
}
/* parchment height = height of the writing + a little breathing room */
function fit() { const c = $('content'); $('stage').style.setProperty('--h', Math.max(c.offsetHeight, 360) + 'px'); }

function setOpen(on) {
  const st = $('stage'), sc = $('scroll'); st.classList.toggle('open', on); sc.setAttribute('aria-expanded', on);
  sc.tabIndex = on ? -1 : 0; if (on) { fit(); setTimeout(() => $('content').scrollIntoView({ behavior:'smooth', block:'nearest' }), 300); }
}
$('scroll').addEventListener('click', () => { if (!$('stage').classList.contains('open')) setOpen(true); });
$('scroll').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !$('stage').classList.contains('open')) { e.preventDefault(); setOpen(true); } });
$('bEn').onclick = () => { lang = 'en'; localStorage.setItem('f27_lang', lang); render(); };
$('bAm').onclick = () => { lang = 'am'; localStorage.setItem('f27_lang', lang); render(); };
addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- load ---------- */
(async function () {
  const slug = qs.get('e');
  if (!slug) { ev = Object.assign({}, DEMO); if (qs.get('title')) ev.title = qs.get('title'); }
  else {
    try {
      const r = await fetch(API + '/api/events/' + encodeURIComponent(slug)); if (!r.ok) throw new Error(r.status);
      let d = await r.json(); d = d.event || d;
      if (typeof d.days === 'string') { try { d.days = JSON.parse(d.days); } catch (e) { d.days = []; } }
      ev = d;
    } catch (e) { ev = null; }
  }
  render();
  if (qs.get('open') === '1') setOpen(true);
})();
</script>
